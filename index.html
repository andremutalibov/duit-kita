<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duit Kita</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duit Kita">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F4F6F1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F4F6F1; --card:#FFFFFF; --ink:#17251D; --muted:#6B776F;
  --line:#DCE2DA; --coin:#F2C230;
  --person:#1E7A50; --person-tint:#E2EFE7; --person-deep:#155C3B;
  --exp:#B23A2E; --inc:#1E7A50;
  --radius:16px;
  --disp:"Bricolage Grotesque", system-ui, sans-serif;
  --num:"Space Grotesk", ui-monospace, monospace;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  padding-bottom:calc(170px + env(safe-area-inset-bottom));
}
body[data-view="add"]{padding-bottom:calc(300px + env(safe-area-inset-bottom))}

header{
  padding:calc(14px + env(safe-area-inset-top)) 20px 4px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
header h1{font-family:var(--disp); font-weight:800; font-size:25px; letter-spacing:-.02em}
header h1 .dot{color:var(--person)}
header .today{font-family:var(--num); font-size:13px; color:var(--muted)}
main{padding:0 16px}
section{margin-top:18px}
.label{
  font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px; padding-left:4px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.label .mini{
  font-family:var(--body); font-weight:700; letter-spacing:0; text-transform:none;
  font-size:12px; color:var(--person); background:var(--person-tint);
  border:none; padding:5px 11px; border-radius:999px; cursor:pointer;
}
.foot{font-family:var(--num); font-size:12px; color:var(--muted); text-align:center;
  letter-spacing:.08em; padding:34px 0 30px; opacity:.6}
.scroll-spacer{height:180px}
.nav-spacer{height:90px}

/* ---------- view switching ---------- */
#v-home,#v-add,#v-wallet{display:none}
body[data-view="home"] #v-home{display:block}
body[data-view="add"] #v-add{display:block}
body[data-view="wallet"] #v-wallet{display:block}
body[data-view="add"] .savebar{display:block}
.savebar{display:none}

/* ---------- navbar ---------- */
.navbar{
  position:fixed; left:0; right:0; bottom:0; z-index:15;
  display:grid; grid-template-columns:repeat(3,1fr);
  background:var(--card); border-top:1.5px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.navbtn{
  background:none; border:none; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:6px 0; color:var(--muted);
  font-family:var(--disp); font-weight:700; font-size:11px;
}
.navbtn .ic{font-size:21px; line-height:1; filter:grayscale(1) opacity(.5); transition:.15s}
.navbtn.sel{color:var(--ink)}
.navbtn.sel .ic{filter:none}

/* ---------- generic chips ---------- */
.grid{display:grid; gap:10px}
.g-amt{grid-template-columns:repeat(3,1fr)}
.g-wal{grid-template-columns:1fr 1fr}
.g-day{grid-template-columns:repeat(3,1fr)}
.chip{
  min-height:54px; border:1.5px solid var(--line); border-radius:var(--radius);
  background:var(--card); color:var(--ink); font-size:15px; font-weight:600;
  font-family:var(--body); cursor:pointer; transition:.15s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 4px;
}
.chip.sel{border-color:var(--person); background:var(--person-tint); color:var(--person-deep); border-width:2px}
.chip.num{font-family:var(--num); font-weight:700; font-size:16px}
.chip.wal{align-items:flex-start; padding-left:14px; text-align:left}
.chip.wal small{font-size:11.5px; color:var(--muted); font-weight:600}
.chip.sel.wal small{color:var(--person-deep); opacity:.75}
.chip.add{border-style:dashed; color:var(--muted); font-weight:700}

.reveal{display:none; margin-top:10px}
.reveal.show{display:block}
.reveal input{
  width:100%; min-height:56px; border:2px solid var(--person); border-radius:var(--radius);
  padding:0 16px; font-family:var(--num); font-size:20px; font-weight:700;
  background:var(--card); color:var(--ink); outline:none;
}
.reveal .hint{font-size:12px; color:var(--muted); margin-top:6px; padding-left:4px}
#note-input{font-family:var(--body); font-size:16px; font-weight:600}

/* ---------- type toggle ---------- */
.type{display:grid; grid-template-columns:1fr 1fr; border:1.5px solid var(--line);
  border-radius:999px; background:var(--card); padding:4px; margin-top:14px}
.type button{
  min-height:44px; border:none; border-radius:999px; background:transparent;
  font-family:var(--disp); font-weight:700; font-size:15px; color:var(--muted); cursor:pointer; transition:.15s;
}
.type button.sel{background:var(--ink); color:#fff}

/* ---------- member avatars ---------- */
.who{display:flex; gap:22px; overflow-x:auto; padding:6px 2px 4px; scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:2px; min-width:66px;
}
.who .ava{
  width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-weight:800; font-size:25px; color:#fff; transition:.18s;
  border:3px solid transparent; opacity:.45;
}
.who .nm{font-family:var(--disp); font-weight:700; font-size:13px; color:var(--muted)}
.who button.sel .ava{opacity:1; transform:scale(1.07); box-shadow:0 6px 16px rgba(0,0,0,.18)}
.who button.sel .nm{color:var(--ink)}
.who .ava.plus{background:var(--card); border:2px dashed var(--line); color:var(--muted); opacity:1; font-size:26px}

/* ---------- category circles ---------- */
.catrow{display:flex; gap:13px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.chip-cat{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px; min-width:62px; padding:2px;
}
.chip-cat .circ{
  width:58px; height:58px; border-radius:50%; background:var(--card);
  border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:25px; transition:.15s;
}
.chip-cat .lbl{font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; max-width:74px; overflow:hidden; text-overflow:ellipsis}
.chip-cat.sel .circ{border:2.5px solid var(--person); background:var(--person-tint); transform:scale(1.06)}
.chip-cat.sel .lbl{color:var(--person-deep); font-weight:700}
.chip-cat .circ.plus{border-style:dashed; color:var(--muted); font-size:24px}

/* ---------- save bar ---------- */
.savebar{
  position:fixed; left:0; right:0; z-index:16;
  bottom:calc(68px + env(safe-area-inset-bottom));
  padding:12px 16px; background:linear-gradient(to top, var(--paper) 72%, transparent);
}
#save{
  width:100%; min-height:58px; border:none; border-radius:18px;
  background:var(--person); color:#fff; font-family:var(--disp); font-weight:800;
  font-size:18px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.14);
}
#save:disabled{background:#C6CDC5; box-shadow:none}
#save .sub{display:block; font-family:var(--num); font-weight:500; font-size:12px; opacity:.85; margin-top:2px}
.errbar{display:none; margin:0 0 10px; padding:12px 14px; border-radius:14px;
  background:#FBEAE7; color:#8C2B1D; font-size:14px; font-weight:600}
.errbar.show{display:block}

/* ---------- HOME ---------- */
.periods{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.periods button{
  min-height:44px; border:1.5px solid var(--line); border-radius:999px; background:var(--card);
  font-family:var(--disp); font-weight:700; font-size:13.5px; color:var(--ink); cursor:pointer;
}
.periods button.sel{background:var(--ink); border-color:var(--ink); color:#fff}
.sumcard{
  margin-top:12px; background:var(--card); border:1.5px solid var(--line);
  border-radius:20px; padding:20px 22px;
}
.sumcard .cap{font-family:var(--disp); font-weight:700; font-size:14px; color:var(--muted)}
.sumcard .dt{font-family:var(--num); font-size:12px; color:var(--muted); margin-top:2px}
.sumcard .big{font-family:var(--num); font-weight:700; font-size:34px; color:var(--exp); margin-top:10px}
.sumcard .big.zero{color:var(--muted)}
.sumcard .split{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
  display:flex; flex-direction:column; gap:7px}
.sr{display:flex; justify-content:space-between; font-size:13px; color:var(--muted)}
.sr b{font-family:var(--num); font-weight:700; color:var(--ink)}
.sr b.inc{color:var(--inc)}

.mfilter{display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px; scrollbar-width:none}
.mfilter::-webkit-scrollbar{display:none}
.mfilter button{
  flex:0 0 auto; min-height:38px; padding:0 16px; border:1.5px solid var(--line);
  border-radius:999px; background:var(--card); font-family:var(--disp);
  font-weight:700; font-size:13px; color:var(--ink); cursor:pointer;
}
.mfilter button.sel{background:var(--ink); border-color:var(--ink); color:#fff}

/* budgets */
.bud{background:var(--card); border:1.5px solid var(--line); border-radius:14px;
  padding:12px 14px; margin-bottom:8px}
.bud .top{display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700}
.bud .top .em{font-size:17px}
.bud .top .rem{margin-left:auto; font-family:var(--num); font-size:12.5px; font-weight:700}
.bud .rem.ok{color:var(--inc)} .bud .rem.over{color:var(--exp)}
.bar{height:7px; border-radius:999px; background:#EDF0EA; margin-top:9px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:999px; background:var(--inc); transition:width .3s}
.bar i.warn{background:var(--coin)} .bar i.over{background:var(--exp)}
.bud .sub{font-size:11.5px; color:var(--muted); margin-top:6px; font-family:var(--num)}

/* transaction list */
.rmonth{font-family:var(--disp); font-weight:800; font-size:19px; margin:20px 4px 2px}
.rday{font-family:var(--num); font-size:12px; color:var(--muted); letter-spacing:.06em; margin:13px 4px 7px}
.rwrap{position:relative; margin-bottom:8px; border-radius:16px; overflow:hidden}
.rcard{
  border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:11px;
  border:1.5px solid transparent; position:relative; z-index:1; background:var(--card);
  touch-action:pan-y; cursor:pointer;
}
.rcard.exp{background:#FBEDEB; border-color:#F3D9D4}
.rcard.inc{background:#EAF3EC; border-color:#D5E7DA}
.rcard .cico{
  width:40px; height:40px; border-radius:999px; flex:0 0 40px; position:relative;
  background:#fff; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.rcard .cico .badge{
  position:absolute; right:-4px; bottom:-4px; width:18px; height:18px; border-radius:50%;
  font-family:var(--disp); font-weight:800; font-size:9.5px; color:#fff;
  display:flex; align-items:center; justify-content:center; border:1.5px solid #fff;
}
.rcard .mid{flex:1; min-width:0}
.rcard .cat{font-weight:700; font-size:14.5px}
.rcard .sub{font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rcard .amt{font-family:var(--num); font-weight:700; font-size:15px; white-space:nowrap}
.rcard.exp .amt{color:var(--exp)} .rcard.inc .amt{color:var(--inc)}
.rtrash{position:absolute; top:0; right:0; bottom:0; width:76px; z-index:0;
  background:var(--exp); border:none; color:#fff; font-size:21px; cursor:pointer}
.lm-wrap{display:flex; justify-content:center; margin:16px 0 6px}
#loadmore{min-height:46px; padding:0 24px; border:1.5px solid var(--line); border-radius:999px;
  background:var(--card); color:var(--ink); font-family:var(--disp); font-weight:700; font-size:14px; cursor:pointer}

/* ---------- WALLET ---------- */
.wgroup{font-family:var(--disp); font-weight:800; font-size:17px; margin:22px 4px 10px}
.wcard{
  border-radius:20px; padding:19px 21px; margin-bottom:12px; color:#fff;
  display:flex; align-items:center; gap:12px; box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.wcard.has-debt{border-radius:20px 20px 0 0; margin-bottom:0}
.wcard .wmeta{flex:1; min-width:0}
.wcard .wname{font-family:var(--disp); font-weight:700; font-size:16px}
.wcard .whint{font-size:11.5px; opacity:.75; margin-top:3px}
.wcard .wval{font-family:var(--num); font-weight:700; font-size:22px; white-space:nowrap}
.wcard .wedit{background:rgba(255,255,255,.25); border:none; color:#fff; border-radius:999px;
  width:33px; height:33px; font-size:14px; cursor:pointer; flex:0 0 33px}
.debtbox{background:var(--card); border:1.5px solid var(--line); border-top:none;
  border-radius:0 0 16px 16px; padding:10px 21px 13px; margin-bottom:12px}
.debtbox .drow{display:flex; justify-content:space-between; align-items:center;
  font-size:12.5px; color:var(--exp); padding:3px 0}
.debtbox .drow b{font-family:var(--num); font-weight:700}
.debtbox .drow.approx{color:var(--muted); border-top:1px dashed var(--line); margin-top:2px; padding-top:6px}
.debtbox .drow.approx b{color:var(--ink)}
.swipepay{position:relative; margin-top:9px; height:33px; border-radius:999px; overflow:hidden;
  background:#F1E4C8; border:1px solid #E3D2A6; display:flex; align-items:center;
  justify-content:center; cursor:pointer; touch-action:pan-y}
.swipepay .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--coin)}
.swipepay span{position:relative; z-index:1; font-size:11.5px; font-weight:700; color:#7A5C15}
.swipepay.done{background:#E2EFE7; border-color:#CFE3D6; cursor:default}
.swipepay.done span{color:var(--inc)}
.addbtn{
  width:100%; min-height:52px; border:1.5px dashed var(--line); border-radius:16px;
  background:var(--card); color:var(--muted); font-family:var(--disp); font-weight:700;
  font-size:14px; cursor:pointer; margin-top:6px;
}

/* ---------- state / overlays ---------- */
.state{margin-top:26px; text-align:center; color:var(--muted); font-size:14px; padding:0 20px}
.state button{margin-top:12px; min-height:44px; padding:0 20px; border:none; border-radius:12px;
  background:var(--ink); color:#fff; font-family:var(--disp); font-weight:700; cursor:pointer}
.state .raw{text-align:left; font-family:var(--num); font-size:11px; background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:10px; word-break:break-all; margin-top:14px}

.ovl{position:fixed; inset:0; background:rgba(23,37,29,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:30; backdrop-filter:blur(2px)}
.ovl.show{display:flex}
.sheet{
  width:min(430px,100%); background:#fff; border-radius:22px 22px 0 0;
  padding:24px 22px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto; animation:up .28s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--disp); font-weight:800; font-size:21px; margin-bottom:4px}
.sheet .sd{font-size:13px; color:var(--muted); margin-bottom:16px}
.fld{margin-bottom:14px}
.fld label{display:block; font-size:12px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.fld input, .fld select{
  width:100%; min-height:52px; border:1.5px solid var(--line); border-radius:14px;
  padding:0 14px; font-family:var(--body); font-size:16px; font-weight:600;
  background:var(--card); color:var(--ink); outline:none;
}
.fld input.num{font-family:var(--num); font-weight:700}
.fld input:focus, .fld select:focus{border-color:var(--person)}
.emojis{display:flex; flex-wrap:wrap; gap:7px}
.emojis button{
  width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--card); font-size:20px; cursor:pointer;
}
.emojis button.sel{border-color:var(--person); background:var(--person-tint); border-width:2.5px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.seg button{
  min-height:46px; border:1.5px solid var(--line); border-radius:12px; background:var(--card);
  font-family:var(--disp); font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;
}
.seg button.sel{background:var(--ink); border-color:var(--ink); color:#fff}
.sheet .go{
  width:100%; min-height:54px; margin-top:8px; border:none; border-radius:16px;
  background:var(--person); color:#fff; font-family:var(--disp); font-weight:800; font-size:16px; cursor:pointer;
}
.sheet .go:disabled{background:#C6CDC5}
.sheet .ghost{
  width:100%; min-height:44px; margin-top:8px; border:none; border-radius:14px;
  background:none; color:var(--muted); font-family:var(--disp); font-weight:700; font-size:14px; cursor:pointer;
}
.sheet .danger{color:var(--exp)}
.manage-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.mrow{
  display:flex; align-items:center; gap:11px; padding:11px 13px;
  border:1.5px solid var(--line); border-radius:13px; background:var(--card);
}
.mrow .dot{width:30px; height:30px; border-radius:999px; flex:0 0 30px; display:flex;
  align-items:center; justify-content:center; color:#fff; font-family:var(--disp);
  font-weight:800; font-size:13px}
.mrow .t{flex:1; min-width:0}
.mrow .t b{font-size:14.5px; display:block}
.mrow .t small{font-size:11.5px; color:var(--muted)}
.mrow .x{background:none; border:none; color:var(--exp); font-size:17px; cursor:pointer; padding:4px 6px}

/* receipt */
.slip .perf{height:12px; margin:-24px -22px 16px;
  background:radial-gradient(circle at 10px -4px, transparent 8px, #fff 8.5px); background-size:20px 12px}
.slip .row{display:flex; justify-content:space-between; padding:9px 0;
  border-bottom:1px dashed var(--line); font-size:15px}
.slip .row b{font-family:var(--num)}
.slip .amt{font-family:var(--num); font-weight:700; font-size:33px; margin:10px 0 6px}

@media (prefers-reduced-motion: reduce){ .sheet{animation:none} *{transition:none!important} }
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coin); outline-offset:2px}
</style>
</head>
<body data-view="home">

<header>
  <h1>Duit Kita<span class="dot">.</span></h1>
  <div class="today" id="hdr-date"></div>
</header>

<!-- ==================== HOME ==================== -->
<main id="v-home">
  <div class="periods">
    <button data-p="day" type="button">Daily</button>
    <button data-p="week" type="button">Weekly</button>
    <button data-p="month" class="sel" type="button">Monthly</button>
  </div>

  <div class="mfilter" id="home-members"></div>

  <div class="sumcard">
    <div class="cap" id="sum-cap">This Month</div>
    <div class="dt" id="sum-range"></div>
    <div class="big" id="sum-exp">Rp0</div>
    <div class="split">
      <div class="sr"><span>Income</span><b class="inc" id="sum-inc">Rp0</b></div>
      <div class="sr"><span>Net</span><b id="sum-net">Rp0</b></div>
    </div>
  </div>

  <section id="budget-sec">
    <div class="label">Budgets <span style="font-weight:600;letter-spacing:0;text-transform:none;font-size:11px" id="bud-note"></span></div>
    <div id="budget-list"></div>
  </section>

  <section>
    <div class="label">Transaction History</div>
    <div id="tx-list"></div>
    <div class="lm-wrap" id="lm-wrap" style="display:none"><button id="loadmore" type="button">Load More</button></div>
  </section>

  <div class="state" id="home-state"></div>
  <footer class="foot">duitkita_v2 · 2026</footer>
  <div class="nav-spacer" aria-hidden="true"></div>
</main>

<!-- ==================== ADD ==================== -->
<main id="v-add">
  <div class="type">
    <button id="t-exp" class="sel" type="button">Expense</button>
    <button id="t-inc" type="button">Income</button>
  </div>

  <section>
    <div class="label">Who's logging</div>
    <div class="who" id="members"></div>
  </section>

  <section>

    <div class="label">Amount</div>

    <div class="reveal" id="amt-reveal">

      <div class="hint">Type the full amount in Rupiah</div>
    </div>
  </section>

  <section>
    <div class="label">
      <span id="wal-label">Wallet</span>
      <button class="mini" id="mng-wal" type="button">Manage</button>

    <div class="grid g-wal" id="wallets"></div>

  <section>

    <div class="grid g-day" id="days"></div>

      <div class="hint">Up to 30 days back</div>

  <div id="wallet-list"></div>

  <div class="state" id="wallet-state"></div>
  <footer class="foot">duitkita_v2 · 2026</footer>
  <div class="nav-spacer" aria-hidden="true"></div>
</main>

  <div class="errbar" id="err"></div>
  <button id="save" type="button" disabled>Pick who's logging</button>
</div>

<nav class="navbar">
  <button class="navbtn sel" data-view="home" type="button"><span class="ic">🏠</span>Home</button>
  <button class="navbtn" data-view="add" type="button"><span class="ic">➕</span>Add</button>
  <button class="navbtn" data-view="wallet" type="button"><span class="ic">👛</span>Wallet</button>
</nav>

<!-- generic bottom sheet -->
<div class="ovl" id="sheet-ovl"><div class="sheet" id="sheet-body"></div></div>

<script>
/* ================= CONFIG ================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0k-IyHSOKKaYSmvhTdJdubpVHbQt1xaRawk312D41VAZSctuSEicXwATRrR-2GpyC1g/exec";
/* ========================================== */

const $ = id => document.getElementById(id);
const fmt = n => "Rp" + Math.round(Number(n)||0).toLocaleString("id-ID");
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc = s => String(s??"").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const JOINT = "joint";
const PALETTE = ["#1E7A50","#B04A72","#2D6CDF","#C9962A","#8B5C8F","#0E7A6B","#B23A2E","#6B5CA5"];
const EMOJI_SET = ["🍜","🛵","🛍️","🧾","🛒","🍼","💵","💼","🎁","🔁","🏠","📅","⛽","💊","🎬","📚","✈️","☕","🐱","✨"];
const AMTS = [50000, 100000];
const DAYS = ["Today","Yesterday","Custom"];

/* app data + ui state */
const D = { members:[], wallets:[], categories:[] };
const S = { type:"Expense", memberId:null, categoryId:null, amount:null, custom:true,
            walletId:null, note:"", day:"Today", customDate:null };
const TX = { all:[], shown:10, period:"month", member:"all" };
const PAGE = 10;
let BAL = { balances:{}, debts:{}, starting:{} };
let BUD = [];

const now = new Date();
$("hdr-date").textContent = now.toLocaleDateString("id-ID",{weekday:"short", day:"numeric", month:"short"});

/* ================= api ================= */
async function api(payload){
  const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(payload) });
  const txt = await res.text();
  let out;
  try { out = JSON.parse(txt); }
  catch(e){ throw new Error("Bad response: " + txt.slice(0,120)); }
  if(!out.ok) throw new Error(out.error || "Request failed");
  return out;
}

/* ================= lookups ================= */
const memberById = id => D.members.find(m=>m.id===id);
const walletById = id => D.wallets.find(w=>w.id===id);
const catById    = id => D.categories.find(c=>c.id===id);
function memberName(id){ const m=memberById(id); return m?m.name:"?"; }
function memberColor(id){ const m=memberById(id); return m?(m.color||"#1E7A50"):"#6B776F"; }
function walletLabel(id){
  const w=walletById(id); if(!w) return "?";
  return w.ownerId===JOINT ? w.name : (w.name + " · " + memberName(w.ownerId));
}
function catLabel(id){ const c=catById(id); return c?c.name:"?"; }
function catEmoji(id){ const c=catById(id); return c&&c.emoji?c.emoji:"✨"; }
/* items visible to a member: their own + joint */
const forMember = (arr, mid) => arr.filter(x => x.ownerId===mid || x.ownerId===JOINT);

/* ================= boot ================= */
async function boot(){
  try{
    let out = await api({action:"bootstrap"});
    if(out.needsSetup){
      /* first run on this sheet: migrate v1 data (or seed a starter household) */
      await api({action:"migrate"});
      out = await api({action:"bootstrap"});
    }
    D.members = out.members; D.wallets = out.wallets; D.categories = out.categories;
    if(D.members.length && !S.memberId) selectMember(D.members[0].id, true);
    buildAdd();
    loadHome();
  }catch(e){
    $("home-state").innerHTML = "Couldn't reach the backend.<br><button id='b-retry' type='button'>Retry</button>"+
      "<div class='raw'>"+esc(e.message)+"</div>";
    $("b-retry").onclick = boot;
  }
}

/* ================= navbar ================= */
document.querySelectorAll(".navbtn").forEach(btn=>{
  btn.onclick = ()=>{
    const v = btn.dataset.view;
    document.body.setAttribute("data-view", v);
    document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("sel", b===btn));
    window.scrollTo(0,0);
    if(v==="home") loadHome();
    if(v==="wallet") loadWallets();
  };
});

/* ================= ADD page ================= */
function buildAdd(){ buildMembers(); buildCats(); buildWallets(); refresh(); }

function buildMembers(){
  const el = $("members"); el.innerHTML = "";
  D.members.forEach(m=>{
    const b = document.createElement("button");
    b.type="button"; b.className = m.id===S.memberId ? "sel" : "";
    b.innerHTML = `<span class="ava" style="background:${esc(m.color||"#1E7A50")}">${esc(m.name[0]||"?").toUpperCase()}</span><span class="nm">${esc(m.name)}</span>`;
    b.onclick = ()=>selectMember(m.id);
    el.appendChild(b);
  });
  const add = document.createElement("button");
  add.type="button";
  add.innerHTML = `<span class="ava plus">+</span><span class="nm">Add</span>`;
  add.onclick = openMembersSheet;
  el.appendChild(add);
}

function selectMember(id, silent){
  S.memberId = id;
  const c = memberColor(id);
  document.documentElement.style.setProperty("--person", c);
  document.documentElement.style.setProperty("--person-deep", c);
  document.documentElement.style.setProperty("--person-tint", c + "22");
  S.categoryId = null; S.walletId = null; S.note = "";
  if($("note-input")) $("note-input").value = "";
  if($("note-reveal")) $("note-reveal").classList.remove("show");
  if(!silent){ buildMembers(); buildCats(); buildWallets(); refresh(); }
}

function buildCats(){
  const el = $("cats"); el.innerHTML = "";
  const kind = S.type==="Income" ? "income" : "expense";
  const list = S.memberId ? forMember(D.categories, S.memberId).filter(c=>c.kind===kind) : [];
  list.forEach(c=>{
    const b = document.createElement("button");
    b.type="button"; b.className = "chip-cat" + (c.id===S.categoryId ? " sel" : "");
    b.innerHTML = `<span class="circ">${esc(c.emoji||"✨")}</span><span class="lbl">${esc(c.name)}</span>`;
    b.onclick = ()=>{ S.categoryId=c.id; buildCats(); $("note-reveal").classList.add("show"); refresh(); };
    el.appendChild(b);
  });
  const add = document.createElement("button");
  add.type="button"; add.className="chip-cat";
  add.innerHTML = `<span class="circ plus">+</span><span class="lbl">New</span>`;
  add.onclick = ()=>openCategorySheet(null);
  el.appendChild(add);
}
$("note-input").addEventListener("input", e=>{ S.note = e.target.value; });

function buildWallets(){
  const el = $("wallets"); el.innerHTML = "";
  $("wal-label").textContent = S.type==="Income" ? "Destination" : "Wallet";
  let list = S.memberId ? forMember(D.wallets, S.memberId) : [];
  /* debt wallets can only be spent from, never received into */
  if(S.type==="Income") list = list.filter(w=>w.type!=="debt");
  /* own wallets first, then joint, then credit lines last */
  const rank = w => (w.type==="debt" ? 2 : (w.ownerId===JOINT ? 1 : 0));
  list = list.slice().sort((a,b)=>rank(a)-rank(b));
  list.forEach(w=>{
    const b = document.createElement("button");
    b.type="button"; b.className = "chip wal" + (w.id===S.walletId ? " sel" : "");
    const tag = w.type==="debt" ? "credit / bill" : (w.ownerId===JOINT ? "joint" : "personal");
    b.innerHTML = `${esc(w.name)}<small>${tag}</small>`;
    b.onclick = ()=>{ S.walletId=w.id; buildWallets(); refresh(); };
    el.appendChild(b);
  });
  const add = document.createElement("button");
  add.type="button"; add.className="chip add";
  add.textContent = "+ New wallet";
  add.onclick = ()=>openWalletSheet(null);
  el.appendChild(add);
  /* default to first available wallet */
  if(!S.walletId && list.length){ S.walletId = list[0].id; buildWallets(); }
}

/* type toggle */
$("t-exp").onclick = ()=>setType("Expense");
$("t-inc").onclick = ()=>setType("Income");
function setType(t){
  if(S.type===t) return;
  S.type=t;
  $("t-exp").classList.toggle("sel", t==="Expense");
  $("t-inc").classList.toggle("sel", t==="Income");
  S.categoryId=null; S.walletId=null; S.note="";
  $("note-input").value=""; $("note-reveal").classList.remove("show");
  buildCats(); buildWallets(); refresh();
}

/* amounts */
function parseAmt(v){ const n=Number(String(v).replace(/[^\d]/g,"")); return n>0?n:null; }
function buildAmts(){
  const el = $("amts"); el.innerHTML="";
  [...AMTS,"Custom"].forEach(it=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip num";
    b.textContent = it==="Custom" ? "···" : (it/1000)+"k";
    if(it==="Custom") b.dataset.custom="1";
    b.onclick=()=>{
      el.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));
      b.classList.add("sel");
      if(it==="Custom"){ S.custom=true; S.amount=parseAmt($("amt-input").value);
        $("amt-reveal").classList.add("show"); $("amt-input").focus(); }
      else { S.custom=false; S.amount=it; $("amt-reveal").classList.remove("show"); }
      refresh();
    };
    el.appendChild(b);
  });
  presetCustom();
}
function presetCustom(){
  S.custom=true; S.amount=parseAmt($("amt-input").value);
  [...$("amts").querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel", c.dataset.custom==="1"));
  $("amt-reveal").classList.add("show");
}
$("amt-input").addEventListener("input", e=>{
  const n=parseAmt(e.target.value);
  e.target.value = n ? n.toLocaleString("id-ID") : "";
  S.amount=n; refresh();
});
buildAmts();

/* days */
const dayInput = $("day-input");
{ const mx=new Date(), mn=new Date(); mn.setDate(mn.getDate()-30);
  dayInput.max=iso(mx); dayInput.min=iso(mn); }
(function buildDays(){
  const el=$("days"); el.innerHTML="";
  DAYS.forEach(it=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(it==="Today"?" sel":"");
    b.textContent=it;
    b.onclick=()=>{
      el.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));
      b.classList.add("sel");
      S.day=it;
      $("day-reveal").classList.toggle("show", it==="Custom");
      if(it==="Custom"){
        if(!dayInput.value) dayInput.value=iso(new Date());
        S.customDate=dayInput.value;
        setTimeout(()=>$("day-reveal").scrollIntoView({behavior:"smooth",block:"center"}),60);
      } else S.customDate=null;
      refresh();
    };
    el.appendChild(b);
  });
})();
dayInput.addEventListener("change", ()=>{ S.customDate=dayInput.value; refresh(); });

/* validate + save */
function entryDate(){
  if(S.day==="Today") return iso(new Date());
  if(S.day==="Yesterday"){ const d=new Date(); d.setDate(d.getDate()-1); return iso(d); }
  return S.customDate;
}
function ready(){ return S.memberId && S.categoryId && S.amount>0 && S.walletId && entryDate(); }
function refresh(){
  const btn=$("save");
  if(!S.memberId){ btn.disabled=true; btn.textContent="Pick who's logging"; return; }
  if(!ready()){
    btn.disabled=true;
    btn.textContent = !S.categoryId ? "Pick a category"
      : (!S.amount ? "Type the amount" : (!S.walletId ? "Pick a wallet" : "Pick a day"));
    return;
  }
  btn.disabled=false;
  btn.innerHTML = `${S.type==="Income"?"Save +":"Save "}${fmt(S.amount)}`+
    `<span class="sub">${esc(catLabel(S.categoryId))} · ${esc(walletLabel(S.walletId))} · ${S.day==="Custom"?S.customDate:S.day}</span>`;
}

$("save").onclick = async ()=>{
  const btn=$("save"), err=$("err");
  err.classList.remove("show");
  btn.disabled=true; btn.textContent="Saving…";
  const payload = { type:S.type, date:entryDate(), memberId:S.memberId,
                    categoryId:S.categoryId, amount:S.amount, walletId:S.walletId,
                    note:(S.note||"").trim() };
  try{
    const out = await api(payload);
    showSlip(payload, out.loggedAt);
    TX.all = []; /* force reload next time Home opens */
  }catch(e){
    err.textContent = "Couldn't save — " + e.message;
    err.classList.add("show");
    refresh();
  }
};

/* receipt */
let lastLoggedAt = null;
function showSlip(p, loggedAt){
  lastLoggedAt = loggedAt || null;
  openSheet(`
    <div class="perf"></div>
    <h2 style="color:var(--person)">${p.type==="Income"?"Income logged ✓":"Logged ✓"}</h2>
    <div class="amt">${p.type==="Income"?"+":""}${fmt(p.amount)}</div>
    <div class="row"><span>Category</span><b>${esc(catLabel(p.categoryId))}</b></div>
    <div class="row"><span>${p.type==="Income"?"Destination":"Wallet"}</span><b>${esc(walletLabel(p.walletId))}</b></div>
    <div class="row"><span>Day</span><b>${esc(p.date)}</b></div>
    <div class="row"><span>By</span><b>${esc(memberName(p.memberId))}</b></div>
    ${p.note?`<div class="row"><span>Note</span><b>${esc(p.note)}</b></div>`:""}
    <button class="go" id="slip-again" type="button">Log another</button>
    <button class="ghost danger" id="slip-del" type="button">Delete this entry</button>
  `, "slip");
  $("slip-again").onclick = ()=>{ closeSheet(); resetForm(); };
  $("slip-del").onclick = async ()=>{
    if(!lastLoggedAt) return;
    const b=$("slip-del"); b.disabled=true; b.textContent="Deleting…";
    try{ await api({action:"deleteTx", loggedAt:lastLoggedAt}); closeSheet(); resetForm(); }
    catch(e){ b.disabled=false; b.textContent="Couldn't delete — retry"; }
  };
}
function resetForm(){
  S.categoryId=null; S.amount=null; S.day="Today"; S.customDate=null; S.note="";
  $("amt-input").value=""; $("day-reveal").classList.remove("show");
  $("note-input").value=""; $("note-reveal").classList.remove("show");
  [...$("days").querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel", c.textContent==="Today"));
  buildCats(); presetCustom(); refresh();
}

/* ================= sheets (modals) ================= */
function openSheet(html, cls){
  const body=$("sheet-body");
  body.className = "sheet" + (cls?" "+cls:"");
  body.innerHTML = html;
  $("sheet-ovl").classList.add("show");
}
function closeSheet(){ $("sheet-ovl").classList.remove("show"); }
$("sheet-ovl").addEventListener("click", e=>{ if(e.target.id==="sheet-ovl") closeSheet(); });

/* ---- members ---- */
$("mng-cat").onclick = openCategoriesSheet;
$("mng-wal").onclick = openWalletsSheet;

function openMembersSheet(){
  const rows = D.members.map(m=>`
    <div class="mrow">
      <span class="dot" style="background:${esc(m.color||"#1E7A50")}">${esc((m.name[0]||"?").toUpperCase())}</span>
      <span class="t"><b>${esc(m.name)}</b><small>household member</small></span>
      <button class="x" data-del="${esc(m.id)}" type="button">✕</button>
    </div>`).join("");
  openSheet(`
    <h2>Household</h2>
    <div class="sd">Everyone who logs in this household.</div>
    <div class="manage-list">${rows || "<div class='sd'>No members yet.</div>"}</div>
    <div class="fld"><label>Add someone</label>
      <input id="nm-name" type="text" placeholder="e.g. Dinda" maxlength="30" autocomplete="off"></div>
    <div class="fld"><label>Colour</label><div class="emojis" id="nm-colors"></div></div>
    <button class="go" id="nm-save" type="button">Add member</button>
    <button class="ghost" id="nm-close" type="button">Done</button>
  `);
  let color = PALETTE[D.members.length % PALETTE.length];
  const cw=$("nm-colors");
  PALETTE.forEach(c=>{
    const b=document.createElement("button");
    b.type="button"; b.style.background=c; b.style.borderColor=c;
    if(c===color) b.classList.add("sel");
    b.onclick=()=>{ color=c; [...cw.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); };
    cw.appendChild(b);
  });
  $("nm-close").onclick = closeSheet;
  $("nm-save").onclick = async ()=>{
    const name=$("nm-name").value.trim();
    if(!name) return;
    const b=$("nm-save"); b.disabled=true; b.textContent="Adding…";
    try{
      await api({action:"addMember", name, color});
      await reloadData(); closeSheet(); openMembersSheet();
    }catch(e){ b.disabled=false; b.textContent="Couldn't add — "+e.message; }
  };
  $("sheet-body").querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = async ()=>{
      b.textContent="…";
      try{ await api({action:"deleteMember", id:b.dataset.del}); await reloadData(); openMembersSheet(); }
      catch(e){ b.textContent="✕"; alertSheet(e.message); }
    };
  });
}

/* ---- categories ---- */
function openCategoriesSheet(){
  const kind = S.type==="Income" ? "income" : "expense";
  const list = S.memberId ? forMember(D.categories, S.memberId).filter(c=>c.kind===kind) : [];
  const rows = list.map(c=>`
    <div class="mrow">
      <span class="dot" style="background:#EDF0EA;color:#17251D;font-size:16px">${esc(c.emoji||"✨")}</span>
      <span class="t"><b>${esc(c.name)}</b><small>${c.budget?("budget "+fmt(c.budget)+"/mo"):"no budget"}${c.ownerId===JOINT?" · shared":""}</small></span>
      <button class="x" data-edit="${esc(c.id)}" type="button" style="color:var(--muted)">✎</button>
      <button class="x" data-del="${esc(c.id)}" type="button">✕</button>
    </div>`).join("");
  openSheet(`
    <h2>${kind==="income"?"Income":"Expense"} categories</h2>
    <div class="sd">For ${esc(memberName(S.memberId))}. Set a monthly ${kind==="income"?"target":"budget"} on any of them.</div>
    <div class="manage-list">${rows || "<div class='sd'>None yet.</div>"}</div>
    <button class="go" id="cs-new" type="button">+ New category</button>
    <button class="ghost" id="cs-close" type="button">Done</button>
  `);
  $("cs-close").onclick = closeSheet;
  $("cs-new").onclick = ()=>openCategorySheet(null);
  $("sheet-body").querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick = ()=>openCategorySheet(b.dataset.edit);
  });
  $("sheet-body").querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = async ()=>{
      b.textContent="…";
      try{ await api({action:"deleteCategory", id:b.dataset.del}); await reloadData(); openCategoriesSheet(); }
      catch(e){ b.textContent="✕"; alertSheet(e.message); }
    };
  });
}

function openCategorySheet(editId){
  const existing = editId ? catById(editId) : null;
  const kind = existing ? existing.kind : (S.type==="Income" ? "income" : "expense");
  openSheet(`
    <h2>${existing?"Edit":"New"} category</h2>
    <div class="sd">${kind==="income"?"Income source":"Spending category"} for ${esc(memberName(S.memberId))}.</div>
    <div class="fld"><label>Name</label>
      <input id="cf-name" type="text" maxlength="30" placeholder="e.g. Groceries" value="${esc(existing?existing.name:"")}"></div>
    <div class="fld"><label>Icon</label><div class="emojis" id="cf-emoji"></div></div>
    <div class="fld"><label>Monthly ${kind==="income"?"target":"budget"} (optional)</label>
      <input id="cf-budget" class="num" inputmode="numeric" placeholder="0 = none"
             value="${existing&&existing.budget?Number(existing.budget).toLocaleString("id-ID"):""}"></div>
    <div class="fld"><label>Shared with household?</label>
      <div class="seg" id="cf-owner">
        <button type="button" data-o="mine">Just me</button>
        <button type="button" data-o="joint">Shared</button>
      </div></div>
    <button class="go" id="cf-save" type="button">${existing?"Save changes":"Add category"}</button>
    <button class="ghost" id="cf-cancel" type="button">Cancel</button>
  `);
  let emoji = existing ? (existing.emoji||"✨") : "✨";
  const ew=$("cf-emoji");
  EMOJI_SET.forEach(e=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=e;
    if(e===emoji) b.classList.add("sel");
    b.onclick=()=>{ emoji=e; [...ew.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); };
    ew.appendChild(b);
  });
  let owner = existing ? (existing.ownerId===JOINT?"joint":"mine") : "mine";
  const ow=$("cf-owner");
  [...ow.children].forEach(b=>{
    if(b.dataset.o===owner) b.classList.add("sel");
    b.onclick=()=>{ owner=b.dataset.o; [...ow.children].forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); };
  });
  $("cf-budget").addEventListener("input", e=>{
    const n=Number(String(e.target.value).replace(/[^\d]/g,""));
    e.target.value = n ? n.toLocaleString("id-ID") : "";
  });
  $("cf-cancel").onclick = ()=>openCategoriesSheet();
  $("cf-save").onclick = async ()=>{
    const name=$("cf-name").value.trim();
    if(!name) return;
    const budget=Number(String($("cf-budget").value).replace(/[^\d]/g,""))||0;
    const ownerId = owner==="joint" ? JOINT : S.memberId;
    const b=$("cf-save"); b.disabled=true; b.textContent="Saving…";
    try{
      if(existing) await api({action:"updateCategory", id:existing.id, name, emoji, budget, ownerId, kind});
      else await api({action:"addCategory", name, emoji, budget, ownerId, kind});
      await reloadData(); openCategoriesSheet();
    }catch(e){ b.disabled=false; b.textContent="Couldn't save — "+e.message; }
  };
}

/* ---- wallets ---- */
function openWalletsSheet(){
  const list = S.memberId ? forMember(D.wallets, S.memberId) : D.wallets;
  const rows = list.map(w=>`
    <div class="mrow">
      <span class="dot" style="background:${w.type==="debt"?"#B23A2E":"#1E7A50"}">${w.type==="debt"?"C":"W"}</span>
      <span class="t"><b>${esc(w.name)}</b><small>${w.ownerId===JOINT?"joint":"personal"}${w.type==="debt"?" · credit / bill":""}</small></span>
      <button class="x" data-edit="${esc(w.id)}" type="button" style="color:var(--muted)">✎</button>
      <button class="x" data-del="${esc(w.id)}" type="button">✕</button>
    </div>`).join("");
  openSheet(`
    <h2>Wallets</h2>
    <div class="sd">Bank accounts, e-wallets, cash, and credit lines.</div>
    <div class="manage-list">${rows || "<div class='sd'>None yet.</div>"}</div>
    <button class="go" id="ws-new" type="button">+ New wallet</button>
    <button class="ghost" id="ws-close" type="button">Done</button>
  `);
  $("ws-close").onclick = closeSheet;
  $("ws-new").onclick = ()=>openWalletSheet(null);
  $("sheet-body").querySelectorAll("[data-edit]").forEach(b=>{ b.onclick=()=>openWalletSheet(b.dataset.edit); });
  $("sheet-body").querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = async ()=>{
      b.textContent="…";
      try{ await api({action:"deleteWallet", id:b.dataset.del}); await reloadData(); openWalletsSheet(); }
      catch(e){ b.textContent="✕"; alertSheet(e.message); }
    };
  });
}

function openWalletSheet(editId){
  const ex = editId ? walletById(editId) : null;
  const normals = D.wallets.filter(w=>w.type!=="debt" && (!ex || w.id!==ex.id));
  openSheet(`
    <h2>${ex?"Edit":"New"} wallet</h2>
    <div class="sd">A place money sits — or a credit line you pay off later.</div>
    <div class="fld"><label>Name</label>
      <input id="wf-name" type="text" maxlength="30" placeholder="e.g. BCA" value="${esc(ex?ex.name:"")}"></div>
    <div class="fld"><label>Belongs to</label>
      <select id="wf-owner">
        ${D.members.map(m=>`<option value="${esc(m.id)}" ${ex? (ex.ownerId===m.id?"selected":"") : (m.id===S.memberId?"selected":"")}>${esc(m.name)}</option>`).join("")}
        <option value="${JOINT}" ${ex&&ex.ownerId===JOINT?"selected":""}>Joint / household</option>
      </select></div>
    <div class="fld"><label>Type</label>
      <div class="seg" id="wf-type">
        <button type="button" data-t="normal">Normal account</button>
        <button type="button" data-t="debt">Credit / paylater</button>
      </div></div>
    <div class="fld" id="wf-link-fld" style="display:none">
      <label>Paid from which wallet?</label>
      <select id="wf-link">
        <option value="">— choose later —</option>
        ${normals.map(w=>`<option value="${esc(w.id)}" ${ex&&ex.linkedWalletId===w.id?"selected":""}>${esc(walletLabel(w.id))}</option>`).join("")}
      </select></div>
    <button class="go" id="wf-save" type="button">${ex?"Save changes":"Add wallet"}</button>
    <button class="ghost" id="wf-cancel" type="button">Cancel</button>
  `);
  let type = ex ? (ex.type==="debt"?"debt":"normal") : "normal";
  const tw=$("wf-type");
  function syncType(){
    [...tw.children].forEach(x=>x.classList.toggle("sel", x.dataset.t===type));
    $("wf-link-fld").style.display = type==="debt" ? "block" : "none";
  }
  [...tw.children].forEach(b=>{ b.onclick=()=>{ type=b.dataset.t; syncType(); }; });
  syncType();
  $("wf-cancel").onclick = ()=>openWalletsSheet();
  $("wf-save").onclick = async ()=>{
    const name=$("wf-name").value.trim();
    if(!name) return;
    const ownerId=$("wf-owner").value;
    const linkedWalletId = type==="debt" ? $("wf-link").value : "";
    const b=$("wf-save"); b.disabled=true; b.textContent="Saving…";
    try{
      if(ex) await api({action:"updateWallet", id:ex.id, name, ownerId, type, linkedWalletId});
      else await api({action:"addWallet", name, ownerId, type, linkedWalletId});
      await reloadData();
      if(document.body.dataset.view==="wallet"){ closeSheet(); loadWallets(); }
      else openWalletsSheet();
    }catch(e){ b.disabled=false; b.textContent="Couldn't save — "+e.message; }
  };
}

function alertSheet(msg){
  const el=document.createElement("div");
  el.className="sd"; el.style.color="var(--exp)"; el.style.marginTop="8px";
  el.textContent=msg;
  $("sheet-body").appendChild(el);
}

async function reloadData(){
  const out = await api({action:"bootstrap"});
  D.members=out.members; D.wallets=out.wallets; D.categories=out.categories;
  if(S.memberId && !memberById(S.memberId)) S.memberId = D.members.length?D.members[0].id:null;
  buildMembers(); buildCats(); buildWallets(); refresh();
}

/* ================= HOME ================= */
document.querySelectorAll(".periods button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll(".periods button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); TX.period=b.dataset.p; TX.shown=PAGE; renderHome();
  };
});

async function loadHome(){
  if(!D.members.length) return;
  buildHomeMembers();
  $("home-state").innerHTML = TX.all.length ? "" : "Loading…";
  try{
    const [lst, bud] = await Promise.all([
      api({action:"list"}),
      api({action:"budgets", month: iso(new Date()).slice(0,7)})
    ]);
    TX.all = lst.entries || [];
    BUD = bud.budgets || [];
    $("home-state").innerHTML = "";
    renderHome();
  }catch(e){
    $("home-state").innerHTML = "Couldn't load — <button id='h-retry' type='button'>Retry</button>"+
      "<div class='raw'>"+esc(e.message)+"</div>";
    $("h-retry").onclick = loadHome;
  }
}

function buildHomeMembers(){
  const el=$("home-members"); el.innerHTML="";
  const mk=(id,label)=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=label;
    if(TX.member===id) b.classList.add("sel");
    b.onclick=()=>{ TX.member=id; TX.shown=PAGE; buildHomeMembers(); renderHome(); };
    el.appendChild(b);
  };
  mk("all","Everyone");
  D.members.forEach(m=>mk(m.id, m.name));
}

function periodRange(){
  const t=new Date(), tk=iso(t);
  if(TX.period==="day") return {from:tk, to:tk, cap:"Today",
    label:t.toLocaleDateString("id-ID",{weekday:"long", day:"numeric", month:"short"})};
  if(TX.period==="week"){
    const mon=new Date(t); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
    return {from:iso(mon), to:tk, cap:"This Week",
      label:mon.toLocaleDateString("id-ID",{day:"numeric",month:"short"})+" – "+t.toLocaleDateString("id-ID",{day:"numeric",month:"short"})};
  }
  const first=new Date(t.getFullYear(), t.getMonth(), 1);
  return {from:iso(first), to:tk, cap:"This Month",
    label:t.toLocaleDateString("id-ID",{month:"long", year:"numeric"})};
}

function homeRows(){
  return TX.member==="all" ? TX.all : TX.all.filter(r=>r.memberId===TX.member);
}

function renderHome(){
  const rows=homeRows();
  const R=periodRange();
  const inR = rows.filter(r=>r.date>=R.from && r.date<=R.to);
  const exp = inR.filter(r=>r.type!=="Income").reduce((a,r)=>a+r.amount,0);
  const inc = inR.filter(r=>r.type==="Income").reduce((a,r)=>a+r.amount,0);
  const net = inc-exp;
  $("sum-cap").textContent = R.cap + (TX.member==="all" ? "" : " · " + memberName(TX.member));
  $("sum-range").textContent = R.label;
  $("sum-exp").textContent = exp ? "−"+fmt(exp) : "Rp0";
  $("sum-exp").classList.toggle("zero", !exp);
  $("sum-inc").textContent = inc ? "+"+fmt(inc) : "Rp0";
  $("sum-net").textContent = (net<0?"−":"")+fmt(Math.abs(net));
  $("sum-net").style.color = net<0 ? "var(--exp)" : "var(--inc)";

  renderBudgets();
  renderTxList(rows);
}

function renderBudgets(){
  const el=$("budget-list"); el.innerHTML="";
  let list = BUD.filter(b=>b.budget>0);
  if(TX.member!=="all") list = list.filter(b=>b.ownerId===TX.member || b.ownerId===JOINT);
  $("bud-note").textContent = list.length ? "this month" : "";
  if(!list.length){
    el.innerHTML = "<div class='sd' style='color:var(--muted);font-size:13px;padding:2px 4px'>No budgets set yet — add one when creating or editing a category on the Add page.</div>";
    return;
  }
  list.forEach(b=>{
    const pct = b.budget ? Math.min(100, Math.round(b.used/b.budget*100)) : 0;
    const over = b.used > b.budget;
    const income = b.kind==="income";
    const cls = income ? (b.used>=b.budget?"":"warn") : (over?"over":(pct>=80?"warn":""));
    const remLabel = income
      ? (b.used>=b.budget ? "target met" : fmt(b.budget-b.used)+" to go")
      : (over ? fmt(b.used-b.budget)+" over" : fmt(b.remaining)+" left");
    const d=document.createElement("div");
    d.className="bud";
    d.innerHTML=`
      <div class="top"><span class="em">${esc(b.emoji||"✨")}</span>${esc(b.name)}
        <span class="rem ${over&&!income?"over":"ok"}">${remLabel}</span></div>
      <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="sub">${fmt(b.used)} of ${fmt(b.budget)}${income?" target":""}</div>`;
    el.appendChild(d);
  });
}

function renderTxList(rows){
  const list=$("tx-list"); list.innerHTML="";
  if(!rows.length){
    list.innerHTML="<div class='sd' style='color:var(--muted);font-size:13px;padding:2px 4px'>No transactions yet.</div>";
    $("lm-wrap").style.display="none"; return;
  }
  const sorted = rows.slice().sort((a,b)=>{
    if(b.date!==a.date) return b.date.localeCompare(a.date);
    return (b.loggedAt||0)-(a.loggedAt||0);
  });
  const slice = sorted.slice(0, TX.shown);
  let curM="", curD="";
  slice.forEach(r=>{
    const d=new Date(r.date+"T00:00:00");
    const valid=!isNaN(d.getTime());
    const mk=r.date.slice(0,7);
    if(mk!==curM){
      curM=mk; curD="";
      const h=document.createElement("div"); h.className="rmonth";
      h.textContent = valid ? d.toLocaleDateString("id-ID",{month:"long", year:"numeric"}) : mk;
      list.appendChild(h);
    }
    if(r.date!==curD){
      curD=r.date;
      const h=document.createElement("div"); h.className="rday";
      h.textContent = valid ? d.toLocaleDateString("id-ID",{weekday:"long", day:"numeric", month:"short"}) : r.date;
      list.appendChild(h);
    }
    const isIn=r.type==="Income";
    const wrap=document.createElement("div"); wrap.className="rwrap";
    wrap.innerHTML =
      `<button class="rtrash" type="button" aria-label="Delete">🗑️</button>`+
      `<div class="rcard ${isIn?"inc":"exp"}">`+
        `<div class="cico">${esc(catEmoji(r.categoryId))}`+
          `<span class="badge" style="background:${esc(memberColor(r.memberId))}">${esc((memberName(r.memberId)[0]||"?").toUpperCase())}</span></div>`+
        `<div class="mid"><div class="cat">${esc(catLabel(r.categoryId))}</div>`+
        `<div class="sub">${esc(walletLabel(r.walletId))}${r.note?` · ${esc(r.note)}`:""}</div></div>`+
        `<div class="amt">${isIn?"+":"−"}${fmt(r.amount)}</div>`+
      `</div>`;
    attachSwipeDelete(wrap, r);
    list.appendChild(wrap);
  });
  $("lm-wrap").style.display = sorted.length > TX.shown ? "flex" : "none";
}
$("loadmore").onclick = ()=>{ TX.shown += PAGE; renderTxList(homeRows()); };

const TRASH_W = 76;
function attachSwipeDelete(wrap, entry){
  const card=wrap.querySelector(".rcard"), trash=wrap.querySelector(".rtrash");
  let sx=0, cx=0, drag=false;
  card.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; drag=true; card.style.transition="none"; },{passive:true});
  card.addEventListener("touchmove", e=>{
    if(!drag) return;
    cx=e.touches[0].clientX-sx;
    if(cx>0) cx=0;
    if(cx<-TRASH_W) cx=-TRASH_W-(cx+TRASH_W)*0.25;
    card.style.transform=`translateX(${cx}px)`;
  },{passive:true});
  card.addEventListener("touchend", ()=>{
    drag=false; card.style.transition="transform .18s ease-out";
    card.style.transform = cx < -TRASH_W/2 ? `translateX(-${TRASH_W}px)` : "translateX(0)";
    cx=0;
  });
  card.addEventListener("click", ()=>{
    const open = card.style.transform === `translateX(-${TRASH_W}px)`;
    document.querySelectorAll(".rwrap .rcard").forEach(c=>{ if(c!==card) c.style.transform="translateX(0)"; });
    card.style.transition="transform .18s ease-out";
    card.style.transform = open ? "translateX(0)" : `translateX(-${TRASH_W}px)`;
  });
  trash.onclick = async ev=>{
    ev.stopPropagation();
    if(entry.loggedAt==null){ trash.textContent="⚠️"; return; }
    trash.disabled=true; trash.textContent="…";
    try{
      await api({action:"deleteTx", loggedAt:entry.loggedAt});
      TX.all = TX.all.filter(x=>x.loggedAt!==entry.loggedAt);
      const b = await api({action:"budgets", month: iso(new Date()).slice(0,7)});
      BUD = b.budgets || [];
      renderHome();
    }catch(e){ trash.disabled=false; trash.textContent="⚠️"; }
  };
}

/* ================= WALLET ================= */
$("add-wallet-btn").onclick = ()=>openWalletSheet(null);

async function loadWallets(){
  if(!D.wallets.length && !D.members.length) return;
  $("wallet-state").innerHTML="Loading…";
  try{
    const out = await api({action:"balances"});
    BAL.balances=out.balances||{}; BAL.debts=out.debts||{}; BAL.starting=out.starting||{};
    $("wallet-state").innerHTML="";
    renderWallets();
  }catch(e){
    $("wallet-state").innerHTML="Couldn't load — <button id='w-retry' type='button'>Retry</button>"+
      "<div class='raw'>"+esc(e.message)+"</div>";
    $("w-retry").onclick=loadWallets;
  }
}

const WALLET_THEMES = ["#1E7A50","#2D6CDF","#8B5C8F","#C9962A","#0E7A6B","#B04A72","#6B5CA5","#A5603A"];
function walletTheme(w, i){ return WALLET_THEMES[i % WALLET_THEMES.length]; }

function renderWallets(){
  const el=$("wallet-list"); el.innerHTML="";
  const debts = D.wallets.filter(w=>w.type==="debt");
  const normals = D.wallets.filter(w=>w.type!=="debt");
  /* group: joint first, then each member */
  const groups = [{key:JOINT, label:"Joint / Household"}]
    .concat(D.members.map(m=>({key:m.id, label:m.name+"'s Wallets"})));

  let idx=0;
  groups.forEach(g=>{
    const mine = normals.filter(w=>w.ownerId===g.key);
    const orphanDebts = debts.filter(w=>w.ownerId===g.key && !normals.some(n=>n.id===w.linkedWalletId));
    if(!mine.length && !orphanDebts.length) return;
    const h=document.createElement("div"); h.className="wgroup"; h.textContent=g.label;
    el.appendChild(h);

    mine.forEach(w=>{
      const val = BAL.balances[w.id] || 0;
      const linked = debts.filter(dw=>dw.linkedWalletId===w.id);
      const color = walletTheme(w, idx++);
      const card=document.createElement("div");
      card.className="wcard"+(linked.length?" has-debt":"");
      card.style.background=color;
      card.innerHTML=`
        <div class="wmeta"><div class="wname">${esc(w.name)}</div>
          <div class="whint">${BAL.starting[w.id]?("start "+fmt(BAL.starting[w.id])):"no starting balance set"}</div></div>
        <div class="wval">${fmt(val)}</div>
        <button class="wedit" type="button" aria-label="Options">✎</button>`;
      card.querySelector(".wedit").onclick=()=>openBalanceSheet(w);
      el.appendChild(card);

      if(linked.length){
        const box=document.createElement("div"); box.className="debtbox";
        let total=0;
        linked.forEach(dw=>{ total += (BAL.debts[dw.id]||0); });
        box.innerHTML = linked.map(dw=>{
          const amt=BAL.debts[dw.id]||0;
          return `<div class="drow"><span>${esc(dw.name)} bill</span><b>−${fmt(amt)}</b></div>`;
        }).join("")
        + `<div class="drow approx"><span>Approx. Balance</span><b>${fmt(val-total)}</b></div>`
        + linked.map(dw=>{
            const amt=BAL.debts[dw.id]||0;
            return amt>0
              ? `<div class="swipepay" data-w="${esc(dw.id)}"><div class="fill"></div><span>Swipe to confirm ${esc(dw.name)} paid</span></div>`
              : `<div class="swipepay done"><span>${esc(dw.name)} all caught up ✓</span></div>`;
          }).join("");
        el.appendChild(box);
        box.querySelectorAll(".swipepay[data-w]").forEach(bar=>attachSwipePay(bar, bar.dataset.w));
      }
    });

    /* debt wallets not linked to any account yet */
    orphanDebts.forEach(dw=>{
      const amt=BAL.debts[dw.id]||0;
      const card=document.createElement("div");
      card.className="wcard"; card.style.background="#B23A2E";
      card.innerHTML=`
        <div class="wmeta"><div class="wname">${esc(dw.name)}</div>
          <div class="whint">credit / bill · not linked to a wallet yet</div></div>
        <div class="wval">−${fmt(amt)}</div>
        <button class="wedit" type="button" aria-label="Edit">✎</button>`;
      card.querySelector(".wedit").onclick=()=>openWalletSheet(dw.id);
      el.appendChild(card);
    });
  });

  if(!el.children.length){
    el.innerHTML="<div class='sd' style='color:var(--muted);font-size:13px;padding:14px 4px'>No wallets yet — add your first one below.</div>";
  }
}

function openBalanceSheet(w){
  const cur = BAL.starting[w.id];
  openSheet(`
    <h2>${esc(w.name)}</h2>
    <div class="sd">${w.ownerId===JOINT?"Joint wallet":esc(memberName(w.ownerId))+"'s wallet"} · balance now ${fmt(BAL.balances[w.id]||0)}</div>
    <div class="fld"><label>Starting balance</label>
      <input id="bf-val" class="num" inputmode="numeric" placeholder="e.g. 1.500.000"
             value="${cur?Number(cur).toLocaleString("id-ID"):""}">
      <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">What this wallet held when you started tracking.</div></div>
    <button class="go" id="bf-save" type="button">Save balance</button>
    <button class="ghost" id="bf-edit" type="button">Edit wallet details</button>
    <button class="ghost" id="bf-cancel" type="button">Cancel</button>
  `);
  $("bf-val").addEventListener("input", e=>{
    const n=Number(String(e.target.value).replace(/[^\d]/g,""));
    e.target.value = n ? n.toLocaleString("id-ID") : "";
  });
  $("bf-cancel").onclick = closeSheet;
  $("bf-edit").onclick = ()=>openWalletSheet(w.id);
  $("bf-save").onclick = async ()=>{
    const val=Number(String($("bf-val").value).replace(/[^\d]/g,""))||0;
    const b=$("bf-save"); b.disabled=true; b.textContent="Saving…";
    try{ await api({action:"setBalance", walletId:w.id, value:val}); closeSheet(); loadWallets(); }
    catch(e){ b.disabled=false; b.textContent="Couldn't save — "+e.message; }
  };
}

function attachSwipePay(bar, walletId){
  const fill=bar.querySelector(".fill");
  let sx=0, drag=false, w=0;
  bar.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; w=bar.clientWidth; drag=true; fill.style.transition="none"; },{passive:true});
  bar.addEventListener("touchmove", e=>{
    if(!drag) return;
    let dx=e.touches[0].clientX-sx;
    if(dx<0) dx=0; if(dx>w) dx=w;
    fill.style.width=dx+"px";
  },{passive:true});
  bar.addEventListener("touchend", ()=>{
    drag=false; fill.style.transition="width .18s ease-out";
    if(fill.offsetWidth/w > 0.85) confirmPaid(walletId, bar);
    else fill.style.width="0px";
  });
  bar.addEventListener("click", ()=>confirmPaid(walletId, bar));
}
async function confirmPaid(walletId, bar){
  bar.querySelector("span").textContent="Confirming…";
  try{ await api({action:"markPaid", walletId}); loadWallets(); }
  catch(e){ bar.querySelector("span").textContent="Couldn't confirm — tap to retry"; bar.querySelector(".fill").style.width="0px"; }
}
