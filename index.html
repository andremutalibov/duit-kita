<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duit Kita</title>

<!-- PWA / iOS install -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Duit Kita">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F4F6F1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#F4F6F1; --card:#FFFFFF; --ink:#17251D; --muted:#6B776F;
  --line:#DCE2DA; --coin:#F2C230;
  --person:#1E7A50; --person-tint:#E2EFE7; --person-deep:#155C3B;
  --income:#1E7A50; --expense:#B23A2E;
  --radius:16px;
  --disp:"Bricolage Grotesque", system-ui, sans-serif;
  --num:"Space Grotesk", ui-monospace, monospace;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
}
body.theme-dinda{ --person:#B04A72; --person-tint:#F6E6ED; --person-deep:#8C3055; }

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  padding-bottom:calc(170px + env(safe-area-inset-bottom));
  transition:background .3s;
}
header{
  padding:calc(14px + env(safe-area-inset-top)) 20px 6px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
header h1{font-family:var(--disp); font-weight:800; font-size:26px; letter-spacing:-.02em}
header h1 .dot{color:var(--person); transition:color .3s}
.hdr-right{display:flex; align-items:center; gap:10px}
.hdr-right .today{font-family:var(--num); font-size:13px; color:var(--muted)}

main{padding:0 16px}
section{margin-top:18px}
.label{
  font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px; padding-left:4px;
  display:flex; align-items:center; gap:8px;
}
.label .auto{
  font-family:var(--body); font-weight:600; letter-spacing:0; text-transform:none;
  font-size:11px; color:var(--person); background:var(--person-tint);
  padding:2px 8px; border-radius:999px; transition:.3s; display:none;
}
.label .auto.show{display:inline-block}

/* ---- type toggle ---- */
.type{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1.5px solid var(--line);
  border-radius:999px; background:var(--card); padding:4px; margin-top:14px}
.type button{
  min-height:44px; border:none; border-radius:999px; background:transparent;
  font-family:var(--disp); font-weight:700; font-size:15px; color:var(--muted); cursor:pointer; transition:.15s;
}
.type button.sel{background:var(--ink); color:#fff}

/* ---- name: circular avatar picker ---- */
.who{display:flex; justify-content:center; gap:34px; padding:6px 0 2px}
.who button{
  background:none; border:none; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:8px; padding:4px;
}
.who .ava{
  width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-weight:800; font-size:32px; transition:.18s;
  border:3px solid transparent; overflow:hidden;
}
.who .ava img{width:100%; height:100%; object-fit:cover; border-radius:50%}
.who .nm{font-family:var(--disp); font-weight:700; font-size:15px; color:var(--muted); transition:.18s}
#btn-andre .ava{background:#E2EFE7; color:#1E7A50}
#btn-dinda .ava{background:#F6E6ED; color:#B04A72}
#btn-andre.sel .ava{background:#1E7A50; color:#fff; border-color:#155C3B; transform:scale(1.06); box-shadow:0 6px 16px rgba(30,122,80,.3)}
#btn-dinda.sel .ava{background:#B04A72; color:#fff; border-color:#8C3055; transform:scale(1.06); box-shadow:0 6px 16px rgba(176,74,114,.3)}
.who button.sel .nm{color:var(--ink)}

/* ---- generic chip grids ---- */
.grid{display:grid; gap:10px}
.g-amt{grid-template-columns:repeat(3,1fr)}
.g-src{grid-template-columns:1fr 1fr}
.g-day{grid-template-columns:repeat(3,1fr)}

/* ---- category: circular slideable row ---- */
.catrow{
  display:flex; gap:14px; overflow-x:auto; padding:4px 2px 10px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.catrow::-webkit-scrollbar{display:none}
.chip-cat{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px; min-width:64px; padding:2px;
}
.chip-cat .circ{
  width:60px; height:60px; border-radius:50%; background:var(--card);
  border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:26px; transition:.15s;
}
.chip-cat .lbl{font-size:12px; font-weight:600; color:var(--muted); white-space:nowrap}
.chip-cat.sel .circ{border:2.5px solid var(--person); background:var(--person-tint); transform:scale(1.06)}
.chip-cat.sel .lbl{color:var(--person-deep); font-weight:700}
.chip{
  min-height:54px; border:1.5px solid var(--line); border-radius:var(--radius);
  background:var(--card); color:var(--ink); font-size:15px; font-weight:600;
  font-family:var(--body); cursor:pointer; transition:.15s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  padding:8px 4px;
}
.chip .em{font-size:19px; line-height:1}
.chip.sel{border-color:var(--person); background:var(--person-tint); color:var(--person-deep); border-width:2px}
.chip.num{font-family:var(--num); font-weight:700; font-size:16px}
.chip.src{align-items:flex-start; padding-left:14px}
.chip.src small{font-size:11.5px; color:var(--muted); font-weight:600}
.chip.sel.src small{color:var(--person-deep); opacity:.7}

.reveal{display:none; margin-top:10px}
.reveal.show{display:block}
.reveal input{
  width:100%; min-height:56px; border:2px solid var(--person); border-radius:var(--radius);
  padding:0 16px; font-family:var(--num); font-size:20px; font-weight:700;
  background:var(--card); color:var(--ink); outline:none;
}
#cat-input{font-family:var(--body); font-size:17px; font-weight:600;}
.reveal .hint{font-size:12px; color:var(--muted); margin-top:6px; padding-left:4px}

.foot{
  font-family:var(--num); font-size:12px; color:var(--muted); text-align:center;
  letter-spacing:.08em; padding:38px 0 44px; opacity:.65;
}

/* ---- sticky save ---- */
.savebar{
  position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top, var(--paper) 70%, transparent);
}
#save{
  width:100%; min-height:60px; border:none; border-radius:18px;
  background:var(--person); color:#fff; font-family:var(--disp); font-weight:800;
  font-size:19px; letter-spacing:.01em; cursor:pointer; transition:.2s;
  box-shadow:0 6px 18px rgba(0,0,0,.14);
}
#save:disabled{background:#C6CDC5; color:#fff; box-shadow:none}
#save .sub{display:block; font-family:var(--num); font-weight:500; font-size:12px; opacity:.85; margin-top:2px}

.errbar{
  display:none; margin:0 16px 10px; padding:12px 14px; border-radius:14px;
  background:#FBEAE7; color:#8C2B1D; font-size:14px; font-weight:600;
}
.errbar.show{display:block}

/* ---- receipt overlay ---- */
#overlay{
  position:fixed; inset:0; background:rgba(23,37,29,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:20; backdrop-filter:blur(2px);
}
#overlay.show{display:flex}
.slip{
  width:min(420px,92%); background:#fff; border-radius:20px 20px 0 0;
  padding:26px 22px calc(22px + env(safe-area-inset-bottom));
  animation:up .3s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.slip .perf{
  height:12px; margin:-26px -22px 18px;
  background:radial-gradient(circle at 10px -4px, transparent 8px, #fff 8.5px);
  background-size:20px 12px;
}
.slip h2{font-family:var(--disp); font-weight:800; font-size:22px; color:var(--person)}
.slip .row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:15px}
.slip .row b{font-family:var(--num)}
.slip .amt{font-family:var(--num); font-weight:700; font-size:34px; margin:12px 0 6px; color:var(--ink)}
.slip button{
  width:100%; min-height:56px; margin-top:18px; border:none; border-radius:16px;
  background:var(--person); color:#fff; font-family:var(--disp); font-weight:800; font-size:17px; cursor:pointer;
}
.slip button.ghost{
  background:none; color:#B23A2E; font-weight:700; font-size:14px; min-height:40px; margin-top:6px;
}

@media (prefers-reduced-motion: reduce){ .slip{animation:none} *{transition:none!important} }
button:focus-visible,input:focus-visible{outline:3px solid var(--coin); outline-offset:2px}

/* ============ REPORT ============ */
#btn-report,#btn-back{
  border:1.5px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:999px; min-height:40px; padding:0 14px; font-family:var(--disp);
  font-weight:600; font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:6px;
}
#btn-back{display:none}
#report{display:none}
body.on-report #btn-report{display:none}
body.on-report #btn-back{display:flex}
body.on-report #report{display:block}
body.on-report #home{display:none}
body.on-report .savebar{display:none}
body.on-report{padding-bottom:calc(40px + env(safe-area-inset-bottom))}

.rmonth{
  font-family:var(--disp); font-weight:800; font-size:20px; margin:22px 4px 4px;
}
.rday{
  font-family:var(--num); font-size:12px; color:var(--muted); letter-spacing:.06em;
  margin:14px 4px 8px;
}
.rcard{
  border-radius:16px; padding:13px 15px; margin-bottom:8px;
  display:flex; align-items:center; gap:12px; border:1.5px solid transparent;
}
.rcard.exp{background:#FBEDEB; border-color:#F3D9D4}
.rcard.inc{background:#EAF3EC; border-color:#D5E7DA}
.rcard .who-dot{
  width:32px; height:32px; border-radius:999px; flex:0 0 32px;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-weight:800; font-size:14px; color:#fff;
}
.who-dot.A{background:#1E7A50} .who-dot.D{background:#B04A72}
.rcard .mid{flex:1; min-width:0}
.rcard .cat{font-weight:700; font-size:15px; color:var(--ink)}
.rcard .sub{font-size:12px; color:var(--muted); margin-top:1px}
.rcard .amt{font-family:var(--num); font-weight:700; font-size:15.5px; white-space:nowrap}
.rcard.exp .amt{color:#B23A2E}
.rcard.inc .amt{color:#1E7A50}

.rstate{margin-top:30px; text-align:center; color:var(--muted); font-size:14px; padding:0 20px}
.rstate button{
  margin-top:12px; min-height:46px; padding:0 20px; border:none; border-radius:12px;
  background:var(--ink); color:#fff; font-family:var(--disp); font-weight:700; cursor:pointer;
}
.rstate .raw{
  text-align:left; font-family:var(--num); font-size:11px; background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:10px; word-break:break-all; margin-top:14px;
}

/* person filter */
.pfilter{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.pfilter button{
  min-height:46px; border:1.5px solid var(--line); border-radius:999px; background:var(--card);
  font-family:var(--disp); font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;
}
.pfilter button.sel{background:var(--ink); border-color:var(--ink); color:#fff}

/* slideable summary */
.sumslider{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  margin-top:14px; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.sumslider::-webkit-scrollbar{display:none}
.sumbig{
  flex:0 0 100%; scroll-snap-align:start; background:var(--card);
  border:1.5px solid var(--line); border-radius:20px; padding:20px 22px;
}
.sumbig .cap{font-family:var(--disp); font-weight:700; font-size:14px; color:var(--muted)}
.sumbig .dt{font-family:var(--num); font-size:12px; color:var(--muted); margin-top:2px}
.sumbig .big{font-family:var(--num); font-weight:700; font-size:32px; color:#B23A2E; margin-top:10px}
.sumbig .big.zero{color:var(--muted)}
.dots{display:flex; justify-content:center; gap:6px; margin-top:10px}
.dots span{width:7px; height:7px; border-radius:50%; background:var(--line); transition:.2s}
.dots span.on{background:var(--ink); transform:scale(1.2)}

/* week / month tiles */
.stat2{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.stat{background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:14px 16px}
.stat .cap{font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.stat .val{font-family:var(--num); font-weight:700; font-size:17px; color:#B23A2E; margin-top:5px}
.stat .val.zero{color:var(--muted)}

/* category icon on cards */
.rcard .cico{
  width:40px; height:40px; border-radius:999px; flex:0 0 40px; position:relative;
  background:#fff; border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.rcard .cico .badge{
  position:absolute; right:-4px; bottom:-4px; width:17px; height:17px; border-radius:50%;
  font-family:var(--disp); font-weight:800; font-size:9.5px; color:#fff;
  display:flex; align-items:center; justify-content:center; border:1.5px solid #fff;
}
.badge.A{background:#1E7A50} .badge.D{background:#B04A72}

/* load more */
.lm-wrap{display:flex; justify-content:center; margin:16px 0 6px}
#loadmore{
  min-height:48px; padding:0 26px; border:1.5px solid var(--line); border-radius:999px;
  background:var(--card); color:var(--ink); font-family:var(--disp); font-weight:700;
  font-size:14px; cursor:pointer;
}

/* swipe-to-delete */
.rwrap{position:relative; margin-bottom:8px; border-radius:16px; overflow:hidden}
.rwrap .rcard{margin-bottom:0; position:relative; z-index:1; touch-action:pan-y; cursor:pointer}
.rtrash{
  position:absolute; top:0; right:0; bottom:0; width:76px; z-index:0;
  background:#B23A2E; border:none; color:#fff; font-size:22px; cursor:pointer;
}
</style>
</head>
<body>

<header>
  <h1>Duit Kita<span class="dot">.</span></h1>
  <div class="hdr-right">
    <button id="btn-report" type="button">📊 Report</button>
    <button id="btn-back" type="button">‹ Journal</button>
    <div class="today" id="hdr-date"></div>
  </div>
</header>

<!-- ============ HOME (logger) ============ -->
<main id="home">
  <div class="type">
    <button id="t-exp" type="button" class="sel">Expense</button>
    <button id="t-inc" type="button">Income</button>
  </div>

  <section>
    <div class="label">Who's logging</div>
    <div class="who">
      <button id="btn-andre" type="button"><span class="ava" id="ava-andre">A</span><span class="nm">Andre</span></button>
      <button id="btn-dinda" type="button"><span class="ava" id="ava-dinda">D</span><span class="nm">Dinda</span></button>
    </div>
  </section>

  <section>
    <div class="label">Category</div>
    <div class="catrow" id="cats"></div>
    <div class="reveal" id="cat-reveal">
      <input id="cat-input" type="text" placeholder="Type category name" autocomplete="off" maxlength="30">
      <div class="hint">e.g. School fee, Gift, Medicine</div>
    </div>
  </section>

  <section id="amt-section">
    <div class="label" id="amt-label">Amount</div>
    <div class="grid g-amt" id="amts"></div>
    <div class="reveal" id="amt-reveal">
      <input id="amt-input" inputmode="numeric" placeholder="e.g. 35.000" autocomplete="off">
      <div class="hint">Type the full amount in Rupiah</div>
    </div>
  </section>

  <section>
    <div class="label"><span id="src-label">Source</span> <span class="auto" id="src-auto">auto</span></div>
    <div class="grid g-src" id="srcs"></div>
  </section>

  <section>
    <div class="label">Day</div>
    <div class="grid g-day" id="days"></div>
    <div class="reveal" id="day-reveal">
      <input id="day-input" type="date">
      <div class="hint">Up to 30 days back</div>
    </div>
  </section>

  <footer class="foot">duitkita_version10 · 2026</footer>
</main>

<!-- ============ REPORT ============ -->
<main id="report">
  <div class="pfilter">
    <button data-p="All" class="sel" type="button">All</button>
    <button data-p="Andre" type="button">Andre</button>
    <button data-p="Dinda" type="button">Dinda</button>
  </div>

  <div class="sumslider" id="sumslider"></div>
  <div class="dots" id="sumdots"></div>

  <div class="stat2">
    <div class="stat"><div class="cap">This Week</div><div class="val" id="stat-week">–</div></div>
    <div class="stat"><div class="cap">This Month</div><div class="val" id="stat-month">–</div></div>
  </div>

  <div id="rlist"></div>
  <div class="lm-wrap" id="lm-wrap" style="display:none"><button id="loadmore" type="button">Load More</button></div>
  <div id="rstate" class="rstate"></div>
  <footer class="foot">duitkita_version10 · 2026</footer>
</main>



<div class="savebar">
  <div class="errbar" id="err"></div>
  <button id="save" type="button" disabled>Pick a name to start</button>
</div>

<div id="overlay">
  <div class="slip">
    <div class="perf"></div>
    <h2 id="slip-title">Logged ✓</h2>
    <div class="amt" id="slip-amt"></div>
    <div class="row"><span>Type</span><b id="slip-type"></b></div>
    <div class="row"><span>Category</span><b id="slip-cat"></b></div>
    <div class="row"><span id="slip-src-label">Source</span><b id="slip-src"></b></div>
    <div class="row"><span>Day</span><b id="slip-day"></b></div>
    <div class="row"><span>By</span><b id="slip-who"></b></div>
    <button id="again" type="button">Log another</button>
    <button id="slip-delete" type="button" class="ghost">Delete this entry</button>
  </div>
</div>

<script>
/* ================= CONFIG ================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0k-IyHSOKKaYSmvhTdJdubpVHbQt1xaRawk312D41VAZSctuSEicXwATRrR-2GpyC1g/exec";
/* ========================================== */

/* Avatars: set a photo URL later to replace the initial, e.g. {img:"dinda.jpg"} */
const AVATARS = { Andre:{img:null, initial:"A"}, Dinda:{img:null, initial:"D"} };

const EXP_CATS = {
  Andre: [
    {k:"Food", em:"🍜"}, {k:"Transport", em:"🛵"}, {k:"Shopping", em:"🛍️"},
    {k:"Bills", em:"🧾"}, {k:"Baby Stuff", em:"🍼"}, {k:"Cash", em:"💵"}, {k:"Other", em:"✨"}
  ],
  Dinda: [
    {k:"Food", em:"🍜"}, {k:"Transport", em:"🛵"}, {k:"Shopping", em:"🛍️"},
    {k:"Groceries", em:"🛒"}, {k:"Baby Stuff", em:"🍼"}, {k:"Cash", em:"💵"}, {k:"Other", em:"✨"}
  ]
};
const INC_CATS = {
  Andre: [
    {k:"Salary", em:"💼"}, {k:"Transfer", em:"🔁"}, {k:"Reimbursement", em:"🧾"},
    {k:"Bonus", em:"🎁"}, {k:"Other", em:"✨"}
  ],
  Dinda: [
    {k:"Salary", em:"💼"}, {k:"Monthly Allowance", em:"📅"}, {k:"Household", em:"🏠"},
    {k:"Transfer", em:"🔁"}, {k:"Reimbursement", em:"🧾"}, {k:"Bonus", em:"🎁"}, {k:"Other", em:"✨"}
  ]
};
const AMTS = [50000, 100000];
const SRCS = ["Seabank", "BCA", "Ewallet", "Cash"];
const DAYS = ["Today","Yesterday","Custom"];

const S = { type:"Expense", name:null, category:null, customCat:null, amount:null, custom:false, source:null, day:"Today", customDate:null };

const $ = id => document.getElementById(id);
const fmt = n => "Rp" + Number(n).toLocaleString("id-ID");
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

const now = new Date();
$("hdr-date").textContent = now.toLocaleDateString("id-ID",{weekday:"short", day:"numeric", month:"short"});

/* ---------- chip helpers ---------- */
function chips(el, items, render, onTap){
  el.innerHTML = "";
  items.forEach(it=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; render(b,it);
    b.onclick=()=>onTap(it,b);
    el.appendChild(b);
  });
}
function selOnly(container, btn){ container.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel")); btn.classList.add("sel"); }

/* ---------- type toggle ---------- */
$("t-exp").onclick = ()=>setType("Expense");
$("t-inc").onclick = ()=>setType("Income");
function setType(t){
  if (S.type === t) return;
  S.type = t;
  $("t-exp").classList.toggle("sel", t==="Expense");
  $("t-inc").classList.toggle("sel", t==="Income");
  S.category = null; S.customCat = null;
  $("cat-reveal").classList.remove("show"); $("cat-input").value = "";
  buildCats();
  /* amount: income skips tiers, goes straight to input */
  if (t === "Income"){
    $("amts").style.display = "none";
    $("amt-reveal").classList.add("show");
    S.custom = true;
    S.amount = parseAmt($("amt-input").value);
    $("src-label").textContent = "Destination";
  } else {
    $("amts").style.display = "";
    presetCustomAmount();
    $("src-label").textContent = "Source";
  }
  refresh();
}

/* ---------- name ---------- */
$("btn-andre").onclick = ()=>pickName("Andre");
$("btn-dinda").onclick = ()=>pickName("Dinda");
function pickName(n){
  S.name=n;
  document.body.classList.toggle("theme-dinda", n==="Dinda");
  $("btn-andre").classList.toggle("sel", n==="Andre");
  $("btn-dinda").classList.toggle("sel", n==="Dinda");
  /* both income & expense categories differ per person — rebuild fresh, clear prior selection */
  S.category=null; S.customCat=null; $("cat-reveal").classList.remove("show"); $("cat-input").value="";
  buildCats();
  /* source auto-defaults to this person's Seabank */
  S.source = "Seabank";
  [... $("srcs").querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel", c.dataset.src==="Seabank"));
  $("src-auto").classList.add("show");
  refresh();
}

/* ---------- avatars (photo-ready) ---------- */
["Andre","Dinda"].forEach(n=>{
  const a = AVATARS[n], el = $("ava-"+n.toLowerCase());
  el.innerHTML = a.img ? `<img src="${a.img}" alt="${n}">` : a.initial;
});

/* ---------- categories (circular, slideable) ---------- */
function buildCats(){
  const isInc = S.type==="Income";
  /* both income and expense categories now depend on who's logging */
  const table = isInc ? INC_CATS : EXP_CATS;
  const list = S.name ? table[S.name] : table.Andre; /* placeholder until a name is picked */

  const el = $("cats");
  el.innerHTML = "";
  list.forEach(it=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip-cat";
    b.innerHTML = `<span class="circ">${it.em}</span><span class="lbl">${it.k}</span>`;
    b.onclick = ()=>{
      el.querySelectorAll(".chip-cat").forEach(c=>c.classList.remove("sel"));
      b.classList.add("sel");
      if (it.k === "Other"){
        S.category = "Other"; S.customCat = parseCat($("cat-input").value);
        $("cat-reveal").classList.add("show"); $("cat-input").focus();
      } else {
        S.category = it.k; S.customCat = null;
        $("cat-reveal").classList.remove("show");
      }
      refresh();
    };
    el.appendChild(b);
  });
}
buildCats();
function parseCat(v){ const s=String(v).trim(); return s.length ? s : null; }
$("cat-input").addEventListener("input", e=>{ S.customCat = parseCat(e.target.value); refresh(); });

/* ---------- amounts (Custom preselected by default) ---------- */
chips($("amts"), [...AMTS,"Custom"], (b,it)=>{
    b.classList.add("num");
    b.textContent = it==="Custom" ? "···" : (it/1000)+"k";
    if(it==="Custom"){ b.title="Custom amount"; b.dataset.custom="1"; }
  },
  (it,b)=>{
    selOnly($("amts"),b);
    if(it==="Custom"){ S.custom=true; S.amount=parseAmt($("amt-input").value); $("amt-reveal").classList.add("show"); $("amt-input").focus(); }
    else{ S.custom=false; S.amount=it; $("amt-reveal").classList.remove("show"); }
    refresh();
  });
function presetCustomAmount(){
  S.custom = true; S.amount = parseAmt($("amt-input").value);
  [... $("amts").querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel", c.dataset.custom==="1"));
  $("amt-reveal").classList.add("show");
}
presetCustomAmount();
function parseAmt(v){ const n=Number(String(v).replace(/[^\d]/g,"")); return n>0?n:null; }
$("amt-input").addEventListener("input", e=>{
  const n=parseAmt(e.target.value);
  e.target.value = n ? n.toLocaleString("id-ID") : "";
  S.amount = n; refresh();
});

/* ---------- sources (person applied at save; Cash is shared) ---------- */
chips($("srcs"), SRCS, (b,it)=>{
    const label = it==="Ewallet" ? "E-wallet" : it;
    b.classList.add("src"); b.dataset.src=it;
    b.innerHTML = it==="Cash" ? `${label}<small>shared</small>` : `${label}<small>auto-named</small>`;
  },
  (it,b)=>{ S.source=it; selOnly($("srcs"),b); $("src-auto").classList.remove("show"); refresh(); });
/* resolve the stored source string: person-suffixed unless Cash */
function resolvedSource(){ return S.source==="Cash" ? "Cash" : (S.source + " " + S.name); }

/* ---------- days ---------- */
const dayInput = $("day-input");
{ const max=new Date(), min=new Date(); min.setDate(min.getDate()-30);
  dayInput.max=iso(max); dayInput.min=iso(min); }
chips($("days"), DAYS, (b,it)=>{ b.textContent=it; if(it==="Today") b.classList.add("sel"); },
  (it,b)=>{
    S.day=it; selOnly($("days"),b);
    $("day-reveal").classList.toggle("show", it==="Custom");
    if(it==="Custom" && !dayInput.value) dayInput.value=iso(new Date());
    S.customDate = it==="Custom" ? dayInput.value : null;
    refresh();
  });
dayInput.addEventListener("change", ()=>{ S.customDate=dayInput.value; refresh(); });

/* ---------- validation + save ---------- */
function entryDate(){
  if(S.day==="Today") return iso(new Date());
  if(S.day==="Yesterday"){ const d=new Date(); d.setDate(d.getDate()-1); return iso(d); }
  return S.customDate;
}
/* the category actually saved: custom text when "Other" is chosen */
function effectiveCat(){ return S.category==="Other" ? S.customCat : S.category; }
function ready(){ return S.name && effectiveCat() && S.amount>0 && S.source && entryDate(); }
function refresh(){
  const btn=$("save");
  if(!S.name){ btn.disabled=true; btn.textContent="Pick a name to start"; return; }
  if(!ready()){
    btn.disabled=true;
    if(!S.category) btn.textContent="Pick a category";
    else if(S.category==="Other" && !S.customCat) btn.textContent="Type the category name";
    else if(!S.amount) btn.textContent = S.custom ? "Type the amount" : "Pick an amount";
    else btn.textContent="Pick a day";
    return;
  }
  btn.disabled=false;
  const verb = S.type==="Income" ? "Save +" : "Save ";
  btn.innerHTML = `${verb}${fmt(S.amount)} <span class="sub">${S.type} · ${effectiveCat()} · ${resolvedSource()} · ${S.day==="Custom"?S.customDate:S.day}</span>`;
}

$("save").onclick = async ()=>{
  const btn=$("save"), err=$("err");
  err.classList.remove("show");
  if(SCRIPT_URL.startsWith("PASTE")){ err.textContent="Setup needed: paste your Apps Script URL into index.html (SCRIPT_URL)."; err.classList.add("show"); return; }
  btn.disabled=true; btn.textContent="Saving…";
  const payload = { type:S.type, date:entryDate(), name:S.name, category:effectiveCat(), amount:S.amount, source:resolvedSource(), loggedVia:"pwa" };
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(payload) });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || "Server rejected the entry");
    payload.loggedAt = out.loggedAt;
    showSlip(payload);
  }catch(e){
    err.textContent = "Couldn't save — check your connection and tap Save again. Nothing was lost.";
    err.classList.add("show");
    refresh();
  }
};

/* ---------- receipt ---------- */
let lastLoggedAt = null;
function showSlip(p){
  lastLoggedAt = p.loggedAt || null;
  $("slip-delete").style.display = lastLoggedAt ? "block" : "none";
  $("slip-delete").textContent = "Delete this entry";
  $("slip-delete").disabled = false;
  $("slip-title").textContent = p.type==="Income" ? "Income logged ✓" : "Logged ✓";
  $("slip-amt").textContent = (p.type==="Income"?"+":"") + fmt(p.amount);
  $("slip-type").textContent = p.type;
  $("slip-cat").textContent = p.category;
  $("slip-src-label").textContent = p.type==="Income" ? "Destination" : "Source";
  $("slip-src").textContent = p.source;
  $("slip-day").textContent = p.date;
  $("slip-who").textContent = p.name;
  $("overlay").classList.add("show");
}
$("slip-delete").onclick = async ()=>{
  if(!lastLoggedAt) return;
  const btn = $("slip-delete");
  btn.disabled = true; btn.textContent = "Deleting…";
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"delete", loggedAt:lastLoggedAt }) });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || "Delete failed");
    lastLoggedAt = null;
    $("overlay").classList.remove("show");
  }catch(e){
    btn.textContent = "Couldn't delete — tap to retry";
    btn.disabled = false;
  }
};
$("again").onclick = ()=>{
  $("overlay").classList.remove("show");
  S.category=null; S.customCat=null; S.day="Today"; S.customDate=null;
  S.source = "Seabank"; $("src-auto").classList.add("show");
  $("amt-input").value=""; S.amount=null;
  $("cat-input").value=""; $("cat-reveal").classList.remove("show");
  if (S.type==="Expense") presetCustomAmount();
  $("day-reveal").classList.remove("show");
  document.querySelectorAll("#cats .chip-cat").forEach(c=>c.classList.remove("sel"));
  [... $("srcs").querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel", c.dataset.src==="Seabank"));
  [... $("days").querySelectorAll(".chip")].forEach(c=>c.classList.toggle("sel", c.textContent==="Today"));
  refresh();
};

/* ============ REPORT ============ */
const RPT = { entries: [], person: "All", shown: 10 };
const PAGE = 10;

/* category → emoji map, built from both people's lists; fallback ✨ */
const CAT_EMOJI = {};
[EXP_CATS.Andre, EXP_CATS.Dinda, INC_CATS.Andre, INC_CATS.Dinda].forEach(list=>{
  list.forEach(it=>{ CAT_EMOJI[it.k] = it.em; });
});
const catIcon = c => CAT_EMOJI[c] || "✨";

$("btn-report").onclick = ()=>{ document.body.classList.add("on-report"); loadReport(); };
$("btn-back").onclick = ()=>{ document.body.classList.remove("on-report"); };

document.querySelectorAll(".pfilter button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll(".pfilter button").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
    RPT.person = b.dataset.p;
    RPT.shown = PAGE;
    renderAll();
  };
});

async function loadReport(){
  $("rlist").innerHTML = ""; $("sumslider").innerHTML = ""; $("sumdots").innerHTML = "";
  $("lm-wrap").style.display = "none";
  $("rstate").innerHTML = "Loading…";
  let raw = "";
  try{
    const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"list" }) });
    raw = await res.text();
    const out = JSON.parse(raw);
    if(!out.ok) throw new Error(out.error || "load failed");
    RPT.entries = out.entries || [];
    RPT.shown = PAGE;
    renderAll();
  }catch(e){
    $("rstate").innerHTML =
      "Couldn't load the report — check your connection.<br><button id='r-retry' type='button'>Retry</button>" +
      "<div class='raw'>" + String(raw || e).replace(/</g,"&lt;").slice(0,400) + "</div>";
    $("r-retry").onclick = loadReport;
  }
}

function filtered(){
  return RPT.person==="All" ? RPT.entries : RPT.entries.filter(r=>r.name===RPT.person);
}

function renderAll(){
  const rows = filtered();
  renderSummary(rows);
  renderList(rows);
}

/* ---- summary: 3-day slider + week/month tiles (expenses only) ---- */
function sumExpOn(rows, dateStr){
  return rows.filter(r=>r.type!=="Income" && r.date===dateStr).reduce((a,r)=>a+r.amount,0);
}
function renderSummary(rows){
  const slider = $("sumslider"), dots = $("sumdots");
  slider.innerHTML = ""; dots.innerHTML = "";
  const labels = ["Today's Expenses","Yesterday's Expenses","2 Days Ago"];
  for(let i=0;i<3;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = iso(d);
    const total = sumExpOn(rows, key);
    const card = document.createElement("div");
    card.className = "sumbig";
    card.innerHTML =
      `<div class="cap">${labels[i]}</div>`+
      `<div class="dt">${d.toLocaleDateString("id-ID",{weekday:"long", day:"numeric", month:"short"})}</div>`+
      `<div class="big ${total?"":"zero"}">${total ? "−"+fmt(total) : "Rp0"}</div>`;
    slider.appendChild(card);
    const dot = document.createElement("span");
    if(i===0) dot.className="on";
    dots.appendChild(dot);
  }
  slider.scrollLeft = 0;
  slider.onscroll = ()=>{
    const idx = Math.round(slider.scrollLeft / slider.clientWidth);
    [...dots.children].forEach((s,i)=>s.classList.toggle("on", i===idx));
  };

  /* week: Monday → today; month: MTD */
  const today = new Date(); const tKey = iso(today);
  const mon = new Date(today); mon.setDate(mon.getDate() - ((mon.getDay()+6)%7));
  const monKey = iso(mon);
  const monthPrefix = tKey.slice(0,7);
  const wk = rows.filter(r=>r.type!=="Income" && r.date>=monKey && r.date<=tKey).reduce((a,r)=>a+r.amount,0);
  const mo = rows.filter(r=>r.type!=="Income" && r.date.indexOf(monthPrefix)===0).reduce((a,r)=>a+r.amount,0);
  $("stat-week").textContent = wk ? "−"+fmt(wk) : "Rp0";
  $("stat-week").classList.toggle("zero", !wk);
  $("stat-month").textContent = mo ? "−"+fmt(mo) : "Rp0";
  $("stat-month").classList.toggle("zero", !mo);
}

/* ---- paginated grouped list ---- */
function renderList(rows){
  const list = $("rlist");
  list.innerHTML = "";
  if(!rows.length){
    $("rstate").innerHTML = "No entries yet — log something in the Journal first.";
    $("lm-wrap").style.display = "none";
    return;
  }
  $("rstate").innerHTML = "";
  const sorted = rows.slice().sort((a,b)=> b.date.localeCompare(a.date));
  const slice = sorted.slice(0, RPT.shown);
  let curMonth = "", curDay = "";
  slice.forEach(r=>{
    const d = new Date(r.date + "T00:00:00");
    const valid = !isNaN(d.getTime());
    const mKey = r.date.slice(0,7);
    if (mKey !== curMonth){
      curMonth = mKey; curDay = "";
      const h = document.createElement("div");
      h.className = "rmonth";
      h.textContent = valid ? d.toLocaleDateString("id-ID",{month:"long", year:"numeric"}) : mKey;
      list.appendChild(h);
    }
    if (r.date !== curDay){
      curDay = r.date;
      const h = document.createElement("div");
      h.className = "rday";
      h.textContent = valid ? d.toLocaleDateString("id-ID",{weekday:"long", day:"numeric", month:"short"}) : r.date;
      list.appendChild(h);
    }
    const isIn = r.type === "Income";
    const wrap = document.createElement("div");
    wrap.className = "rwrap";
    wrap.innerHTML =
      `<button class="rtrash" type="button" aria-label="Delete">🗑️</button>`+
      `<div class="rcard ${isIn?"inc":"exp"}">`+
        `<div class="cico">${catIcon(r.category)}<span class="badge ${r.name==="Andre"?"A":"D"}">${(r.name||"?")[0]}</span></div>`+
        `<div class="mid"><div class="cat"></div><div class="sub"></div></div>`+
        `<div class="amt">${isIn?"+":"−"}${fmt(r.amount)}</div>`+
      `</div>`;
    wrap.querySelector(".cat").textContent = r.category;
    wrap.querySelector(".sub").textContent = r.source;
    attachSwipeDelete(wrap, r);
    list.appendChild(wrap);
  });
  $("lm-wrap").style.display = sorted.length > RPT.shown ? "flex" : "none";
}
$("loadmore").onclick = ()=>{ RPT.shown += PAGE; renderList(filtered()); };

/* ---- swipe-left-to-reveal delete (instant delete on tap, no confirm) ---- */
const TRASH_W = 76;
function closeAllSwipes(except){
  document.querySelectorAll(".rwrap .rcard").forEach(c=>{ if(c!==except) c.style.transform = "translateX(0)"; });
}
function attachSwipeDelete(wrap, entry){
  const card = wrap.querySelector(".rcard");
  const trash = wrap.querySelector(".rtrash");
  let startX = 0, curX = 0, dragging = false;

  card.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX; dragging = true;
    card.style.transition = "none";
  }, {passive:true});
  card.addEventListener("touchmove", e=>{
    if(!dragging) return;
    curX = e.touches[0].clientX - startX;
    if(curX > 0) curX = 0; // no swipe right
    if(curX < -TRASH_W) curX = -TRASH_W - (curX + TRASH_W) * 0.25; // slight resistance past reveal
    card.style.transform = `translateX(${curX}px)`;
  }, {passive:true});
  card.addEventListener("touchend", ()=>{
    dragging = false;
    card.style.transition = "transform .18s ease-out";
    if(curX < -TRASH_W/2){ closeAllSwipes(card); card.style.transform = `translateX(-${TRASH_W}px)`; }
    else { card.style.transform = "translateX(0)"; }
    curX = 0;
  });
  /* desktop testing convenience: click the card to toggle reveal */
  card.addEventListener("click", ()=>{
    const open = card.style.transform === `translateX(-${TRASH_W}px)`;
    closeAllSwipes();
    card.style.transition = "transform .18s ease-out";
    card.style.transform = open ? "translateX(0)" : `translateX(-${TRASH_W}px)`;
  });

  trash.onclick = async (ev)=>{
    ev.stopPropagation();
    if(entry.loggedAt == null){ trash.textContent="⚠️"; return; } // old rows without a timestamp can't be targeted safely
    trash.disabled = true; trash.textContent = "…";
    try{
      const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify({ action:"delete", loggedAt: entry.loggedAt }) });
      const out = await res.json();
      if(!out.ok) throw new Error(out.error || "Delete failed");
      RPT.entries = RPT.entries.filter(e2=>e2.loggedAt !== entry.loggedAt);
      renderAll();
    }catch(e){
      trash.disabled = false; trash.textContent = "⚠️";
    }
  };
}

refresh();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
