<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Duit Kita</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duit Kita">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0E1116">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#0E1116; --card:#191D24; --card-2:#232935; --ink:#F3F5F8; --muted:#8A929E;
  --line:#2A2F3A; --coin:#CFA94D;
  --accent:#2DD4BF; --accent-dim:#1E8578; --accent-tint:#2DD4BF1F;
  --person:#22B378; --person-tint:#22B37826; --person-deep:#5FE0AE;
  --exp:#E5573D; --inc:#22B378;
  --disabled-bg:#2A2F3A; --err-bg:#3A1E1A; --err-fg:#F0A79A;
  --card-shadow:none;
  --radius:16px;
  --disp:"Bricolage Grotesque", system-ui, sans-serif;
  --num:"Space Grotesk", ui-monospace, monospace;
  --body:system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="light"]{
  --paper:#EEF1F5; --card:#FFFFFF; --card-2:#F3F5F8; --ink:#1A222C; --muted:#6B7480;
  --line:#E2E6EC; --coin:#B8912F;
  --accent:#0FA896; --accent-dim:#0B7D70; --accent-tint:#0FA8961A;
  --person:#1FA971; --person-tint:#1FA97122; --person-deep:#0F7A50;
  --exp:#D9463A; --inc:#159C63;
  --disabled-bg:#D8DCE2; --err-bg:#FBEAE7; --err-fg:#8C2B1D;
  --card-shadow:0 1px 3px rgba(20,30,45,.06);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--body); background:var(--paper); color:var(--ink);
  padding-bottom:calc(170px + env(safe-area-inset-bottom));
}
body[data-view="add"]{padding-bottom:calc(300px + env(safe-area-inset-bottom))}

header{
  padding:calc(14px + env(safe-area-inset-top)) 20px 4px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
header h1{font-family:var(--disp); font-weight:800; font-size:25px; letter-spacing:-.02em}
header h1 .dot{color:var(--person)}
.theme-toggle{
  width:38px; height:38px; border-radius:999px; border:1.5px solid var(--line);
  background:var(--card-2); font-size:17px; cursor:pointer; line-height:1;
  display:flex; align-items:center; justify-content:center; flex:0 0 38px;
}
.theme-toggle:active{background:var(--accent-tint)}
main{padding:0 16px}
section{margin-top:18px}
.label{
  font-family:var(--disp); font-weight:600; font-size:12px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px; padding-left:4px;
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.label .mini{
  font-family:var(--body); font-weight:700; letter-spacing:0; text-transform:none;
  font-size:12px; color:var(--person); background:var(--person-tint);
  border:none; padding:5px 11px; border-radius:999px; cursor:pointer;
}
.foot{font-family:var(--num); font-size:12px; color:var(--muted); text-align:center;
  letter-spacing:.08em; padding:34px 0 30px; opacity:.6}
.scroll-spacer{height:180px}
.nav-spacer{height:90px}

/* ---------- view switching ---------- */
#v-home,#v-add,#v-wallet,#v-transaction{display:none}
body[data-view="home"] #v-home{display:block}
body[data-view="add"] #v-add{display:block}
body[data-view="wallet"] #v-wallet{display:block}
body[data-view="transaction"] #v-transaction{display:block}
body[data-view="add"] .savebar{display:block}
.savebar{display:none}

/* ---------- navbar ---------- */
.navbar{
  position:fixed; left:0; right:0; bottom:0; z-index:15;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--card); border-top:1.5px solid var(--line);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
}
.navbtn{
  background:none; border:none; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; gap:3px; padding:6px 0; color:var(--muted);
  font-family:var(--disp); font-weight:700; font-size:10.5px;
}
.navbtn .ic{font-size:21px; line-height:1; filter:grayscale(1) opacity(.5); transition:.15s}
.navbtn.sel{color:var(--accent)}
.navbtn.sel .ic{filter:none}

/* ---------- generic chips ---------- */
.grid{display:grid; gap:10px}
.g-amt{grid-template-columns:repeat(3,1fr)}
.g-wal{grid-template-columns:1fr 1fr}
.g-day{grid-template-columns:repeat(3,1fr)}
.chip{
  min-height:54px; border:1.5px solid var(--line); border-radius:var(--radius);
  background:var(--card); color:var(--ink); font-size:15px; font-weight:600;
  font-family:var(--body); cursor:pointer; transition:.15s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:8px 4px;
}
.chip.sel{border-color:var(--accent); background:var(--accent-tint); color:var(--ink); border-width:2px}
.chip.num{font-family:var(--num); font-weight:700; font-size:16px}
.chip.wal{align-items:flex-start; padding-left:14px; text-align:left}
.chip.wal small{font-size:11.5px; color:var(--muted); font-weight:600}
.chip.sel.wal small{color:var(--accent); opacity:.85}
.chip.add{border-style:dashed; color:var(--muted); font-weight:700}

.reveal{display:none; margin-top:10px}
.reveal.show{display:block}
.reveal input{
  width:100%; min-height:56px; border:2px solid var(--accent); border-radius:var(--radius);
  padding:0 16px; font-family:var(--num); font-size:20px; font-weight:700;
  background:var(--card); color:var(--ink); outline:none;
}
.reveal .hint{font-size:12px; color:var(--muted); margin-top:6px; padding-left:4px}
#note-input{font-family:var(--body); font-size:16px; font-weight:600}

/* primary amount field + quick-fill pills */
.amtbox{
  display:flex; align-items:center; gap:8px; width:100%; min-height:62px; margin-top:2px;
  border:2px solid var(--accent); border-radius:var(--radius); padding:0 16px; background:var(--card);
}
.amtbox .amtcur{font-family:var(--num); font-weight:700; font-size:18px; color:var(--muted)}
.amtbox input{
  flex:1; min-width:0; border:none; background:none; outline:none; padding:0;
  font-family:var(--num); font-weight:700; font-size:25px; color:var(--ink);
}
.amtbox input::placeholder{color:var(--muted)}
.quickfill{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
.qf{
  min-height:30px; padding:0 13px; border-radius:999px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:var(--num); font-weight:700; font-size:12px;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.qf:active{background:var(--accent-tint)}
.qf.sel{border-color:var(--accent); background:var(--accent-tint); color:var(--accent)}
.qf.edit{border-style:dashed; color:var(--muted); min-width:36px; font-size:13px}

/* ---------- type toggle ---------- */
.type{display:grid; grid-template-columns:1fr 1fr; border:1.5px solid var(--line);
  border-radius:999px; background:var(--card); padding:4px; margin-top:14px}
.type button{
  min-height:44px; border:none; border-radius:999px; background:transparent;
  font-family:var(--disp); font-weight:700; font-size:15px; color:var(--muted); cursor:pointer; transition:.15s;
}
.type button.sel{background:var(--person); color:#06120C}

/* ---------- member avatars ---------- */
.who{display:flex; gap:22px; overflow-x:auto; padding:6px 2px 4px; scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:7px; padding:2px; min-width:66px;
}
.who .ava{
  width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-weight:800; font-size:25px; color:#fff; transition:.18s;
  border:3px solid transparent; opacity:.45;
}
.who .nm{font-family:var(--disp); font-weight:700; font-size:13px; color:var(--muted)}
.who button.sel .ava{opacity:1; transform:scale(1.07); border-color:var(--person); box-shadow:0 0 16px -2px var(--person)}
.who button.sel .nm{color:var(--ink)}
.who .ava.plus{background:var(--card); border:2px dashed var(--line); color:var(--muted); opacity:1; font-size:26px}

/* ---------- category circles ---------- */
.catrow{display:flex; gap:13px; overflow-x:auto; padding:4px 2px 10px; scrollbar-width:none}
.catrow::-webkit-scrollbar{display:none}
.chip-cat{
  flex:0 0 auto; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:6px; min-width:62px; padding:2px;
}
.chip-cat .circ{
  width:58px; height:58px; border-radius:50%; background:var(--card);
  border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center;
  font-size:25px; transition:.15s;
}
.chip-cat .lbl{font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; max-width:74px; overflow:hidden; text-overflow:ellipsis}
.chip-cat.sel .circ{border:2.5px solid var(--accent); background:var(--accent-tint); transform:scale(1.06); box-shadow:0 0 14px -3px var(--accent)}
.chip-cat.sel .lbl{color:var(--accent); font-weight:700}
.chip-cat .circ.plus{border-style:dashed; color:var(--muted); font-size:24px}

/* ---------- save bar ---------- */
.savebar{
  position:fixed; left:0; right:0; z-index:16;
  bottom:calc(68px + env(safe-area-inset-bottom));
  padding:12px 16px; background:linear-gradient(to top, var(--paper) 72%, transparent);
}
#save{
  width:100%; min-height:58px; border:none; border-radius:18px;
  background:var(--person); color:#fff; font-family:var(--disp); font-weight:800;
  font-size:18px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.14);
}
#save:disabled{background:var(--disabled-bg); color:var(--muted); box-shadow:none}
#save .sub{display:block; font-family:var(--num); font-weight:500; font-size:12px; opacity:.85; margin-top:2px}
.errbar{display:none; margin:0 0 10px; padding:12px 14px; border-radius:14px;
  background:var(--err-bg); color:var(--err-fg); font-size:14px; font-weight:600}
.errbar.show{display:block}

/* ---------- HOME ---------- */
/* slideable month overview */
.sumslider{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  margin-top:12px; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.sumslider::-webkit-scrollbar{display:none}
.sumcard{
  flex:0 0 100%; scroll-snap-align:start; background:var(--card);
  border:1.5px solid var(--line); border-radius:20px; padding:20px 22px; box-shadow:var(--card-shadow);
}
.sumcard .cap{font-family:var(--disp); font-weight:700; font-size:14px; color:var(--muted)}
.sumcard .dt{font-family:var(--num); font-size:12px; color:var(--muted); margin-top:2px}
.sumcard .big{font-family:var(--num); font-weight:700; font-size:34px; color:var(--exp); margin-top:10px}
.sumcard .big.zero{color:var(--muted)}
.sumcard .split{margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
  display:flex; flex-direction:column; gap:7px}
.sumcard .sub2{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  display:flex; flex-direction:column; gap:7px}
.sr{display:flex; justify-content:space-between; font-size:13px; color:var(--muted)}
.sr b{font-family:var(--num); font-weight:700; color:var(--ink)}
.sr b.inc{color:var(--inc)}

.dots{display:flex; justify-content:center; gap:6px; margin-top:10px}
.dots span{width:7px; height:7px; border-radius:50%; background:var(--line); transition:.2s}
.dots span.on{background:var(--ink); transform:scale(1.2)}

/* slideable budgets, synced with overview */
.budgetslider{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.budgetslider::-webkit-scrollbar{display:none}
.budgetpage{flex:0 0 100%; scroll-snap-align:start; min-width:0}

/* transaction-page monthly calendar */
.calslider{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none; margin-top:12px}
.calslider::-webkit-scrollbar{display:none}
.calpage{flex:0 0 100%; scroll-snap-align:start; min-width:0;
  background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:16px 12px 12px; box-shadow:var(--card-shadow)}
.cal-month{font-family:var(--disp); font-weight:800; font-size:17px; text-align:center; margin-bottom:12px}
.calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.caldayhead{text-align:center; font-family:var(--disp); font-weight:700; font-size:10px; color:var(--muted); padding-bottom:2px}
.calbody{margin-top:2px}
.calcell{
  min-height:46px; border-radius:8px; padding:3px 1px 2px; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  background:var(--paper); border:1px solid transparent;
}
.calcell.empty{background:transparent}
.calcell.has{cursor:pointer; border-color:var(--line)}
.calcell.has:active{background:var(--accent-tint)}
.calcell.today{border-color:var(--accent); border-width:1.5px; box-shadow:0 0 10px -3px var(--accent)}
.calcell .cd{font-family:var(--num); font-size:11px; font-weight:700; color:var(--ink)}
.calcell.today .cd{color:var(--accent)}
.calcell .ce{font-family:var(--num); font-size:8.5px; font-weight:700; color:var(--exp); line-height:1.15; white-space:nowrap}
.calcell .ci{font-family:var(--num); font-size:8.5px; font-weight:700; color:var(--inc); line-height:1.15; white-space:nowrap}
.cal-toggle-wrap{display:flex; justify-content:center; margin-top:10px}
#caldots{display:none}
.cal-toggle{
  border:1.5px solid var(--accent); background:var(--accent-tint); border-radius:999px;
  font-family:var(--disp); font-weight:700; font-size:12px; color:var(--accent);
  padding:8px 18px; cursor:pointer; min-height:38px;
}
.cal-toggle:active{background:var(--accent);color:#06201C}
/* calendar prev/next arrows */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:8px}
.cal-head .cal-month{margin-bottom:0; flex:1}
.cal-arrow{flex:0 0 auto; width:30px; height:30px; border-radius:999px; border:none;
  background:var(--card-2); color:var(--ink); font-size:16px; cursor:pointer; line-height:1}
.cal-arrow:disabled{opacity:.3; cursor:default}

/* monthly report pie */
.rep-month-label{font-family:var(--disp); font-weight:800; font-size:19px; color:var(--ink); margin-bottom:14px; text-align:center}
.reportslider{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch; scrollbar-width:none}
.reportslider::-webkit-scrollbar{display:none}
.reportpage{
  flex:0 0 100%; scroll-snap-align:start; min-width:0;
  background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:20px 18px 16px; box-shadow:var(--card-shadow);
}
.pie-wrap{display:flex; justify-content:center; align-items:center; position:relative}
.pie-wrap svg{width:100%; max-width:190px; height:auto}
.pie-lbl{font-family:var(--num); font-weight:700; fill:#fff}
.pie-emoji{font-size:13px}
.rep-totals{margin-top:16px; padding-top:12px; border-top:1px dashed var(--line);
  display:flex; flex-direction:column; gap:7px}
.rep-totals .sr b.inc{color:var(--inc)}
.legend{margin-top:16px; display:flex; flex-direction:column; gap:8px}
.legrow{
  display:flex; align-items:center; gap:11px; padding:10px 13px; border-radius:13px; cursor:pointer;
  border:1.5px solid var(--line); background:var(--card-2);
}
.legrow:active{background:var(--accent-tint)}
.legdot{width:32px; height:32px; border-radius:999px; flex:0 0 32px; border:1.5px solid;
  display:flex; align-items:center; justify-content:center; font-size:16px}
.legrow .nm{flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.legrow .val{font-family:var(--num); font-weight:700; font-size:12.5px; margin-right:2px; color:var(--ink)}
.legrow .pctv{font-family:var(--num); font-size:11.5px; color:var(--muted); min-width:32px; text-align:right}
.legrow .chev{color:var(--muted); font-size:16px; font-weight:700; opacity:.5}
.rep-empty{text-align:center; color:var(--muted); font-size:13px; padding:26px 10px}

.mfilter{display:flex; gap:8px; overflow-x:auto; margin-top:12px; padding-bottom:2px; scrollbar-width:none}
.mfilter::-webkit-scrollbar{display:none}
.mfilter button{
  flex:0 0 auto; min-height:38px; padding:0 16px; border:1.5px solid var(--line);
  border-radius:999px; background:var(--card); font-family:var(--disp);
  font-weight:700; font-size:13px; color:var(--ink); cursor:pointer;
}
.mfilter button.sel{background:var(--accent); border-color:var(--accent); color:#06201C}

/* budgets */
.bud{background:var(--card); border:1.5px solid var(--line); border-radius:14px; box-shadow:var(--card-shadow);
  padding:12px 14px; margin-bottom:8px}
.bud .top{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700}
.bud .top .budico{width:32px; height:32px; border-radius:999px; flex:0 0 32px; border:1.5px solid;
  display:flex; align-items:center; justify-content:center; font-size:16px}
.bud .top .em{font-size:17px}
.bud .top .rem{margin-left:auto; font-family:var(--num); font-size:12.5px; font-weight:700}
.bud .rem.ok{color:var(--inc)} .bud .rem.over{color:var(--exp)}
.bar{height:7px; border-radius:999px; background:var(--card-2); margin-top:9px; overflow:hidden}
.bar i{display:block; height:100%; border-radius:999px; background:var(--inc); transition:width .3s}
.bar i.warn{background:var(--coin)} .bar i.over{background:var(--exp)}
.bud .sub{font-size:11.5px; color:var(--muted); margin-top:6px; font-family:var(--num)}

/* transaction list */
.rmonth{font-family:var(--disp); font-weight:800; font-size:19px; margin:20px 4px 2px}
.rday{font-family:var(--num); font-size:12px; color:var(--muted); letter-spacing:.06em; margin:13px 4px 7px}
.rwrap{position:relative; margin-bottom:8px; border-radius:16px; overflow:hidden}
.rcard{
  border-radius:16px; padding:12px 14px; display:flex; align-items:center; gap:11px;
  border:1.5px solid transparent; position:relative; z-index:1; background:var(--card);
  touch-action:pan-y; cursor:pointer;
}
.rcard.exp{background:var(--card); border-color:var(--line); border-left:3px solid var(--exp)}
.rcard.inc{background:var(--card); border-color:var(--line); border-left:3px solid var(--inc)}
.rcard .cico{
  width:40px; height:40px; border-radius:999px; flex:0 0 40px; position:relative;
  background:var(--card-2); border:1.5px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:19px;
}
.rcard.exp .cico{box-shadow:0 0 10px -2px var(--exp)}
.rcard.inc .cico{box-shadow:0 0 10px -2px var(--inc)}
.rcard .cico .badge{
  position:absolute; right:-4px; bottom:-4px; width:18px; height:18px; border-radius:50%;
  font-family:var(--disp); font-weight:800; font-size:9.5px; color:#fff;
  display:flex; align-items:center; justify-content:center; border:1.5px solid var(--card);
}
.rcard .mid{flex:1; min-width:0}
.rcard .cat{font-weight:700; font-size:14.5px}
.rcard .sub{font-size:12px; color:var(--muted); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rcard .amt{font-family:var(--num); font-weight:700; font-size:15px; white-space:nowrap}
.rcard.exp .amt{color:var(--exp)} .rcard.inc .amt{color:var(--inc)}
.rtrash{position:absolute; top:0; right:0; bottom:0; width:76px; z-index:0;
  background:var(--exp); border:none; color:#fff; font-size:21px; cursor:pointer}
.lm-wrap{display:flex; justify-content:center; margin:16px 0 6px}
#loadmore{min-height:46px; padding:0 24px; border:1.5px solid var(--line); border-radius:999px;
  background:var(--card); color:var(--ink); font-family:var(--disp); font-weight:700; font-size:14px; cursor:pointer}

/* ---------- WALLET ---------- */
.wgroup{font-family:var(--disp); font-weight:800; font-size:17px; margin:22px 4px 10px; color:var(--ink)}
.wcard{
  border-radius:16px; padding:18px 20px; margin-bottom:12px; color:var(--ink);
  background:var(--card); border:1.5px solid var(--line); border-left-width:4px;
  display:flex; align-items:center; gap:12px;
}
.wcard.has-debt{border-radius:16px 16px 0 0; margin-bottom:0}
.wcard .wmeta{flex:1; min-width:0}
.wcard .wchip{width:38px; height:38px; border-radius:11px; flex:0 0 38px; display:flex;
  align-items:center; justify-content:center; font-family:var(--disp); font-weight:800; font-size:16px}
.wcard .wname{font-family:var(--disp); font-weight:700; font-size:16px}
.wcard .whint{font-size:11.5px; color:var(--muted); margin-top:3px}
.wcard .wval{font-family:var(--num); font-weight:700; font-size:22px; white-space:nowrap}
.wcard .wedit{background:var(--card-2); border:none; color:var(--muted); border-radius:999px;
  width:33px; height:33px; font-size:14px; cursor:pointer; flex:0 0 33px}
.debtbox{background:var(--card); border:1.5px solid var(--line); border-top:none;
  border-radius:0 0 16px 16px; padding:10px 20px 13px; margin-bottom:12px}
.debtbox .drow{display:flex; justify-content:space-between; align-items:center;
  font-size:12.5px; color:var(--exp); padding:3px 0}
.debtbox .drow b{font-family:var(--num); font-weight:700}
.debtbox .drow.approx{color:var(--muted); border-top:1px dashed var(--line); margin-top:2px; padding-top:6px}
.debtbox .drow.approx b{color:var(--ink)}
.swipepay{position:relative; margin-top:9px; height:33px; border-radius:999px; overflow:hidden;
  background:var(--card-2); border:1px solid var(--line); display:flex; align-items:center;
  justify-content:center; cursor:pointer; touch-action:pan-y}
.swipepay .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--coin); opacity:.5}
.swipepay span{position:relative; z-index:1; font-size:11.5px; font-weight:700; color:var(--coin)}
.swipepay.done{background:var(--person-tint); border-color:transparent; cursor:default}
.swipepay.done span{color:var(--inc)}
.addbtn{
  width:100%; min-height:52px; border:1.5px dashed var(--line); border-radius:16px;
  background:var(--card); color:var(--muted); font-family:var(--disp); font-weight:700;
  font-size:14px; cursor:pointer; margin-top:6px;
}

/* ---------- state / overlays ---------- */
.state{margin-top:26px; text-align:center; color:var(--muted); font-size:14px; padding:0 20px}
.state button{margin-top:12px; min-height:44px; padding:0 20px; border:none; border-radius:12px;
  background:var(--accent); color:#06201C; font-family:var(--disp); font-weight:700; cursor:pointer}
.state .raw{text-align:left; font-family:var(--num); font-size:11px; background:var(--card);
  border:1px solid var(--line); border-radius:10px; padding:10px; word-break:break-all; margin-top:14px}

.ovl{position:fixed; inset:0; background:rgba(23,37,29,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:30; backdrop-filter:blur(2px)}
.ovl.show{display:flex}
.sheet{
  width:min(430px,100%); background:var(--card); border-radius:22px 22px 0 0;
  padding:24px 22px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto; animation:up .28s ease-out;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--disp); font-weight:800; font-size:21px; margin-bottom:4px}
.sheet .sd{font-size:13px; color:var(--muted); margin-bottom:16px}
.fld{margin-bottom:14px}
.fld label{display:block; font-size:12px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.fld input, .fld select{
  width:100%; min-height:52px; border:1.5px solid var(--line); border-radius:14px;
  padding:0 14px; font-family:var(--body); font-size:16px; font-weight:600;
  background:var(--card-2); color:var(--ink); outline:none;
}
.fld input.num{font-family:var(--num); font-weight:700}
.fld input:focus, .fld select:focus{border-color:var(--accent)}
.emojis{display:flex; flex-wrap:wrap; gap:7px}
.emojis button{
  width:44px; height:44px; border-radius:12px; border:1.5px solid var(--line);
  background:var(--card-2); font-size:20px; cursor:pointer;
}
.emojis button.sel{border-color:var(--accent); background:var(--accent-tint); border-width:2.5px}
.seg{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.seg button{
  min-height:46px; border:1.5px solid var(--line); border-radius:12px; background:var(--card);
  font-family:var(--disp); font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;
}
.seg button.sel{background:var(--accent); border-color:var(--accent); color:#06201C}
.sheet .go{
  width:100%; min-height:54px; margin-top:8px; border:none; border-radius:16px;
  background:var(--person); color:#fff; font-family:var(--disp); font-weight:800; font-size:16px; cursor:pointer;
}
.sheet .go:disabled{background:var(--disabled-bg); color:var(--muted)}
.sheet .ghost{
  width:100%; min-height:44px; margin-top:8px; border:none; border-radius:14px;
  background:none; color:var(--muted); font-family:var(--disp); font-weight:700; font-size:14px; cursor:pointer;
}
.sheet .danger{color:var(--exp)}
.manage-list{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.mrow{
  display:flex; align-items:center; gap:11px; padding:11px 13px;
  border:1.5px solid var(--line); border-radius:13px; background:var(--card);
}
.mrow .dot{width:30px; height:30px; border-radius:999px; flex:0 0 30px; display:flex;
  align-items:center; justify-content:center; color:#fff; font-family:var(--disp);
  font-weight:800; font-size:13px}
.mrow .t{flex:1; min-width:0}
.mrow .t b{font-size:14.5px; display:block}
.mrow .t small{font-size:11.5px; color:var(--muted)}
.mrow .x{background:none; border:none; color:var(--exp); font-size:17px; cursor:pointer; padding:4px 6px}

/* receipt */
.slip .perf{height:12px; margin:-24px -22px 16px;
  background:radial-gradient(circle at 10px -4px, transparent 8px, var(--card) 8.5px); background-size:20px 12px}
.slip .row{display:flex; justify-content:space-between; padding:9px 0;
  border-bottom:1px dashed var(--line); font-size:15px}
.slip .row b{font-family:var(--num)}
.slip .amt{font-family:var(--num); font-weight:700; font-size:33px; margin:10px 0 6px}

@media (prefers-reduced-motion: reduce){ .sheet{animation:none} *{transition:none!important} }
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--coin); outline-offset:2px}
</style>

<!-- generic bottom sheet -->
<div class="ovl" id="sheet-ovl"><div class="sheet" id="sheet-body"></div></div>

<script>
/* ================= CONFIG ================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0k-IyHSOKKaYSmvhTdJdubpVHbQt1xaRawk312D41VAZSctuSEicXwATRrR-2GpyC1g/exec";
/* ========================================== */

const $ = id => document.getElementById(id);
const fmt = n => "Rp" + Math.round(Number(n)||0).toLocaleString("id-ID");
/* compact form for tight spaces: 347000 -> 347k, 1500000 -> 1.5M */
const compactAmt = n => {
  const a = Math.abs(Number(n)||0);
  if(a >= 1e6){ const v=a/1e6; return (v>=10?Math.round(v):Math.round(v*10)/10)+"M"; }
  if(a >= 1e3){ return Math.round(a/1e3)+"k"; }
  return String(Math.round(a));
};
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc = s => String(s??"").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const JOINT = "joint";
const PALETTE = ["#1E7A50","#B04A72","#2D6CDF","#C9962A","#8B5C8F","#0E7A6B","#B23A2E","#6B5CA5"];
const EMOJI_SET = ["🍜","🛵","🛍️","🧾","🛒","🍼","💵","💼","🎁","🔁","🏠","📅","⛽","💊","🎬","📚","✈️","☕","🐱","✨"];
const DAYS = ["Today","Yesterday","Custom"];

/* app data + ui state */
const D = { members:[], wallets:[], categories:[] };
const S = { type:"Expense", memberId:null, categoryId:null, amount:null,
            walletId:null, note:"", day:"Today", customDate:null };
const TX = { all:[], shown:10, member:"all" };
const PAGE = 10;
let BAL = { balances:{}, debts:{}, starting:{} };

const now = new Date();

/* ================= theme (dark default, light option) ================= */
const THEME_KEY = "duitkita-theme";
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  const btn=$("theme-toggle"); if(btn) btn.textContent = (t==="light" ? "🌙" : "☀️");
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.content = (t==="light" ? "#EEF1F5" : "#0E1116");
}
(function initTheme(){
  let t="dark";
  try{ t = localStorage.getItem(THEME_KEY) || "dark"; }catch(e){}
  applyTheme(t);
})();
$("theme-toggle").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme")==="light" ? "light" : "dark";
  const next = cur==="light" ? "dark" : "light";
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyTheme(next);
};

/* ================= api ================= */
async function api(payload){
  const res = await fetch(SCRIPT_URL, { method:"POST", body: JSON.stringify(payload) });
  const txt = await res.text();
  let out;
  try { out = JSON.parse(txt); }
  catch(e){ throw new Error("Bad response: " + txt.slice(0,120)); }
  if(!out.ok) throw new Error(out.error || "Request failed");
  return out;
}

/* ================= lookups ================= */
const memberById = id => D.members.find(m=>m.id===id);
const walletById = id => D.wallets.find(w=>w.id===id);
const catById    = id => D.categories.find(c=>c.id===id);
function memberName(id){ const m=memberById(id); return m?m.name:"?"; }
function memberColor(id){ const m=memberById(id); return m?(m.color||"#1E7A50"):"#6B776F"; }
function walletLabel(id){
  const w=walletById(id); if(!w) return "?";
  return w.ownerId===JOINT ? w.name : (w.name + " · " + memberName(w.ownerId));
}
function catLabel(id){ const c=catById(id); return c?c.name:"?"; }
function catEmoji(id){ const c=catById(id); return c&&c.emoji?c.emoji:"✨"; }
/* items visible to a member: their own + joint */
const forMember = (arr, mid) => arr.filter(x => x.ownerId===mid || x.ownerId===JOINT);

/* ================= boot ================= */
async function boot(){
  try{
    let out = await api({action:"bootstrap"});
    if(out.needsSetup){
      /* first run on this sheet: migrate v1 data (or seed a starter household) */
      await api({action:"migrate"});
      out = await api({action:"bootstrap"});
    }
    D.members = out.members; D.wallets = out.wallets; D.categories = out.categories;
    if(D.members.length && !S.memberId) selectMember(D.members[0].id, true);
    buildAdd();
    loadHome();
  }catch(e){
    $("home-state").innerHTML = "Couldn't reach the backend.<br><button id='b-retry' type='button'>Retry</button>"+
      "<div class='raw'>"+esc(e.message)+"</div>";
    $("b-retry").onclick = boot;
  }
}

/* ================= navbar ================= */
document.querySelectorAll(".navbtn").forEach(btn=>{
  btn.onclick = ()=>{
    const v = btn.dataset.view;
    document.body.setAttribute("data-view", v);
    document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("sel", b===btn));
    window.scrollTo(0,0);
    if(v==="home") loadHome();
    if(v==="wallet") loadWallets();
    if(v==="transaction") loadTransactionPage();
  };
});

/* ================= ADD page ================= */
function buildAdd(){ buildMembers(); buildCats(); buildWallets(); refresh(); }

function buildMembers(){
  const el = $("members"); el.innerHTML = "";
  D.members.forEach(m=>{
    const b = document.createElement("button");
    b.type="button"; b.className = m.id===S.memberId ? "sel" : "";
    b.innerHTML = `<span class="ava" style="background:${esc(m.color||"#1E7A50")}">${esc(m.name[0]||"?").toUpperCase()}</span><span class="nm">${esc(m.name)}</span>`;
    b.onclick = ()=>selectMember(m.id);
    el.appendChild(b);
  });
  const add = document.createElement("button");
  add.type="button";
  add.innerHTML = `<span class="ava plus">+</span><span class="nm">Add</span>`;
  add.onclick = openMembersSheet;
  el.appendChild(add);
}

function selectMember(id, silent){
  S.memberId = id;
  const c = memberColor(id);
  document.documentElement.style.setProperty("--person", c);
  document.documentElement.style.setProperty("--person-deep", c);
  document.documentElement.style.setProperty("--person-tint", c + "22");
  S.categoryId = null; S.walletId = null; S.note = "";
  if($("note-input")) $("note-input").value = "";
  if($("note-reveal")) $("note-reveal").classList.remove("show");
  if(!silent){ buildMembers(); buildCats(); buildWallets(); refresh(); }
}

function buildCats(){
  const el = $("cats"); el.innerHTML = "";
  const kind = S.type==="Income" ? "income" : "expense";
  const list = S.memberId ? forMember(D.categories, S.memberId).filter(c=>c.kind===kind) : [];
  list.forEach(c=>{
    const b = document.createElement("button");
    b.type="button"; b.className = "chip-cat" + (c.id===S.categoryId ? " sel" : "");
    b.innerHTML = `<span class="circ">${esc(c.emoji||"✨")}</span><span class="lbl">${esc(c.name)}</span>`;
    b.onclick = ()=>{ S.categoryId=c.id; buildCats(); $("note-reveal").classList.add("show"); refresh(); };
    el.appendChild(b);
  });
  const add = document.createElement("button");
  add.type="button"; add.className="chip-cat";
  add.innerHTML = `<span class="circ plus">+</span><span class="lbl">New</span>`;
  add.onclick = ()=>openCategorySheet(null);
  el.appendChild(add);
}
$("note-input").addEventListener("input", e=>{ S.note = e.target.value; });

function buildWallets(){
  const el = $("wallets"); el.innerHTML = "";
  $("wal-label").textContent = S.type==="Income" ? "Destination" : "Wallet";
  let list = S.memberId ? forMember(D.wallets, S.memberId) : [];
  /* debt wallets can only be spent from, never received into */
  if(S.type==="Income") list = list.filter(w=>w.type!=="debt");
  /* own wallets first, then joint, then credit lines last */
  const rank = w => (w.type==="debt" ? 2 : (w.ownerId===JOINT ? 1 : 0));
  list = list.slice().sort((a,b)=>rank(a)-rank(b));
  list.forEach(w=>{
    const b = document.createElement("button");
    b.type="button"; b.className = "chip wal" + (w.id===S.walletId ? " sel" : "");
    const tag = w.type==="debt" ? "credit / bill" : (w.ownerId===JOINT ? "joint" : "personal");
    b.innerHTML = `${esc(w.name)}<small>${tag}</small>`;
    b.onclick = ()=>{ S.walletId=w.id; buildWallets(); refresh(); };
    el.appendChild(b);
  });
  const add = document.createElement("button");
  add.type="button"; add.className="chip add";
  add.textContent = "+ New wallet";
  add.onclick = ()=>openWalletSheet(null);
  el.appendChild(add);
  /* default to first available wallet */
  if(!S.walletId && list.length){ S.walletId = list[0].id; buildWallets(); }
}

/* type toggle */
$("t-exp").onclick = ()=>setType("Expense");
$("t-inc").onclick = ()=>setType("Income");
function setType(t){
  if(S.type===t) return;
  S.type=t;
  $("t-exp").classList.toggle("sel", t==="Expense");
  $("t-inc").classList.toggle("sel", t==="Income");
  S.categoryId=null; S.walletId=null; S.note="";
  $("note-input").value=""; $("note-reveal").classList.remove("show");
  buildCats(); buildWallets(); refresh();
}

/* amounts */
function parseAmt(v){ const n=Number(String(v).replace(/[^\d]/g,"")); return n>0?n:null; }

/* quick-fill preset amounts (customizable, persisted) */
const DEFAULT_QF = [50000, 100000];
let QUICKFILL = (function(){
  try{ const s=localStorage.getItem("duitkita-quickfill"); if(s){ const a=JSON.parse(s); if(Array.isArray(a)&&a.length) return a; } }catch(e){}
  return DEFAULT_QF.slice();
})();
function saveQuickfill(){ try{ localStorage.setItem("duitkita-quickfill", JSON.stringify(QUICKFILL)); }catch(e){} }

function buildQuickfill(){
  const el = $("quickfill"); el.innerHTML="";
  QUICKFILL.slice().sort((a,b)=>a-b).forEach(v=>{
    const b=document.createElement("button");
    b.type="button"; b.className="qf";
    b.textContent = compactAmt(v);
    b.onclick=()=>{
      S.amount=v; $("amt-input").value=v.toLocaleString("id-ID");
      [...el.querySelectorAll(".qf")].forEach(x=>x.classList.remove("sel"));
      b.classList.add("sel"); refresh();
    };
    el.appendChild(b);
  });
  const edit=document.createElement("button");
  edit.type="button"; edit.className="qf edit"; edit.textContent="✎";
  edit.setAttribute("aria-label","Edit quick amounts");
  edit.onclick=openQuickfillSheet;
  el.appendChild(edit);
}

function openQuickfillSheet(){
  const rows = QUICKFILL.slice().sort((a,b)=>a-b).map(v=>`
    <div class="mrow">
      <span class="dot" style="background:var(--accent-tint);color:var(--accent);font-family:var(--num);font-size:12px">${compactAmt(v)}</span>
      <span class="t"><b>${fmt(v)}</b><small>quick-fill shortcut</small></span>
      <button class="x" data-rm="${v}" type="button">✕</button>
    </div>`).join("");
  openSheet(`
    <h2>Quick amounts</h2>
    <div class="sd">Shortcuts shown under the amount field.</div>
    <div class="manage-list">${rows || "<div class='sd'>None yet.</div>"}</div>

/* ---- transaction calendar: collapsible week row / expandable full month ---- */
const WEEKDAYS_ID = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"]; // Monday-first (month mode)
const MAX_WEEKS_BACK = 8;
let calMode = "week"; // "week" (default, collapsed) | "month" (expanded)

function dateMinus(n){ const d=new Date(); d.setDate(d.getDate()-n); return iso(d); }

/* how many rolling 7-day windows back have data, capped at MAX_WEEKS_BACK */
function weeksAvailable(){
  if(!TX.all.length) return 1;
  let earliest=TX.all[0].date; TX.all.forEach(r=>{ if(r.date<earliest) earliest=r.date; });
  const today=new Date(); today.setHours(0,0,0,0);
  const eDate=new Date(earliest+"T00:00:00");
  const days=Math.floor((today - eDate)/86400000);
  return Math.min(MAX_WEEKS_BACK, Math.max(0, Math.floor(days/7))) + 1;
}

function wireCalSlider(slider, dots){
  slider.scrollLeft=0;
  const total = slider.children.length;
  const updateArrows = ()=>{
    const idx = Math.round(slider.scrollLeft/(slider.clientWidth||1));
    [...dots.children].forEach((s,j)=>s.classList.toggle("on", j===idx));
    slider.querySelectorAll(".cal-arrow.prev").forEach(a=>a.disabled = idx>=total-1); // older
    slider.querySelectorAll(".cal-arrow.next").forEach(a=>a.disabled = idx<=0);        // newer
  };
  slider.onscroll = updateArrows;
  slider.querySelectorAll(".calcell[data-date]").forEach(c=>{
    c.onclick = ()=>openDayHistory(c.dataset.date);
  });
  slider.querySelectorAll(".cal-arrow.prev").forEach(a=>a.onclick=()=>{
    const idx = Math.round(slider.scrollLeft/(slider.clientWidth||1));
    if(idx<total-1) slider.scrollTo({left:(idx+1)*slider.clientWidth, behavior:"smooth"});
  });
  slider.querySelectorAll(".cal-arrow.next").forEach(a=>a.onclick=()=>{
    const idx = Math.round(slider.scrollLeft/(slider.clientWidth||1));
    if(idx>0) slider.scrollTo({left:(idx-1)*slider.clientWidth, behavior:"smooth"});
  });
  updateArrows();
}

function renderTxCalendar(){
  if(calMode==="week") renderCalWeek(); else renderCalMonth();
  const btn=$("cal-toggle");
  if(btn) btn.textContent = calMode==="week" ? "Expand to month ▾" : "Collapse to week ▴";
}

/* rolling 7-day windows ending today; each slide steps back one week */
function renderCalWeek(){
  const slider = $("calslider"), dots = $("caldots");
  slider.innerHTML=""; dots.innerHTML="";
  const rows = homeRows();
  const todayStr = iso(new Date());
  const count = weeksAvailable();

  for(let i=0;i<count;i++){
    const dates=[];
    for(let j=0;j<7;j++) dates.push(dateMinus(7*i + (6-j))); // oldest→today, left→right
    const map={};
    rows.forEach(r=>{
      if(dates.indexOf(r.date)<0) return;
      const t = map[r.date] || (map[r.date]={e:0,i:0});
      if(r.type==="Income") t.i+=r.amount; else t.e+=r.amount;
    });

    let heads="", cells="";
    dates.forEach(ds=>{
      const dObj=new Date(ds+"T00:00:00");
      heads += `<div class="caldayhead">${esc(dObj.toLocaleDateString("id-ID",{weekday:"short"}))}</div>`;
      const t=map[ds]||{e:0,i:0};
      const has=t.e>0||t.i>0, today=ds===todayStr;
      cells += `<div class="calcell${has?" has":""}${today?" today":""}"${has?` data-date="${esc(ds)}"`:""}>
          <span class="cd">${dObj.getDate()}</span>
          ${t.e>0?`<span class="ce">-${compactAmt(t.e)}</span>`:""}
          ${t.i>0?`<span class="ci">+${compactAmt(t.i)}</span>`:""}
        </div>`;
    });

    const L=new Date(dates[0]+"T00:00:00"), Rr=new Date(dates[6]+"T00:00:00");
    const sameM = dates[0].slice(0,7)===dates[6].slice(0,7);
    const rangeLabel = L.getDate()+(sameM?"":" "+L.toLocaleDateString("id-ID",{month:"short"}))
      +" – "+Rr.getDate()+" "+Rr.toLocaleDateString("id-ID",{month:"short"})+" "+Rr.getFullYear();

    const page=document.createElement("div"); page.className="calpage week";
    page.innerHTML = `
      <div class="cal-head">
        <button class="cal-arrow prev" type="button" aria-label="Previous">‹</button>
        <div class="cal-month">${esc(rangeLabel)}</div>
        <button class="cal-arrow next" type="button" aria-label="Next">›</button>
      </div>
      <div class="calgrid calhead">${heads}</div>
      <div class="calgrid calbody">${cells}</div>`;
    slider.appendChild(page);
    const dot=document.createElement("span"); if(i===0) dot.className="on";
    dots.appendChild(dot);
  }
  wireCalSlider(slider, dots);
}

/* full month grid; each slide steps back one month */
function renderCalMonth(){
  const count = monthsAvailable();
  const slider = $("calslider"), dots = $("caldots");
  slider.innerHTML=""; dots.innerHTML="";
  const rows = homeRows();
  const todayStr = iso(new Date());

  for(let i=0;i<count;i++){
    const key = monthKeyOffset(i);
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    const year=d.getFullYear(), mon=d.getMonth();
    const dim = new Date(year, mon+1, 0).getDate();
    const offset = (new Date(year, mon, 1).getDay()+6)%7; // Monday-first leading blanks

    const dayExp={}, dayInc={};
    rows.forEach(r=>{
      if(r.date.indexOf(key)!==0) return;
      const dd = Number(r.date.slice(8,10));
      if(r.type==="Income") dayInc[dd]=(dayInc[dd]||0)+r.amount;
      else dayExp[dd]=(dayExp[dd]||0)+r.amount;
    });

    let cells="";
    for(let k=0;k<offset;k++) cells+=`<div class="calcell empty"></div>`;
    for(let day=1;day<=dim;day++){
      const dateStr = key+"-"+String(day).padStart(2,"0");
      const e=dayExp[day]||0, inc=dayInc[day]||0;
      const has = e>0 || inc>0;
      const today = dateStr===todayStr;
      cells += `<div class="calcell${has?" has":""}${today?" today":""}"${has?` data-date="${esc(dateStr)}"`:""}>
          <span class="cd">${day}</span>
          ${e>0?`<span class="ce">-${compactAmt(e)}</span>`:""}
          ${inc>0?`<span class="ci">+${compactAmt(inc)}</span>`:""}
        </div>`;
    }

    const monthLabel = d.toLocaleDateString("id-ID",{month:"long", year:"numeric"});
    const page=document.createElement("div"); page.className="calpage";
    page.innerHTML = `
      <div class="cal-head">
        <button class="cal-arrow prev" type="button" aria-label="Previous">‹</button>
        <div class="cal-month">${esc(monthLabel)}</div>
        <button class="cal-arrow next" type="button" aria-label="Next">›</button>
      </div>
      <div class="calgrid calhead">${WEEKDAYS_ID.map(w=>`<div class="caldayhead">${w}</div>`).join("")}</div>
      <div class="calgrid calbody">${cells}</div>`;
    slider.appendChild(page);
    const dot=document.createElement("span"); if(i===0) dot.className="on";
    dots.appendChild(dot);
  }
  wireCalSlider(slider, dots);
}

/* month helpers */
function monthKeyOffset(offset){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-offset);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function daysInMonthOffset(offset){
  const d=new Date(); const y=d.getFullYear(), m=d.getMonth()-offset;
  return new Date(y, m+1, 0).getDate();
}
/* how many month-slides we actually have data for (1..MAX_MONTHS_BACK+1) */
function monthsAvailable(){
  if(!TX.all.length) return 1;
  let earliest = TX.all[0].date;
  TX.all.forEach(r=>{ if(r.date<earliest) earliest=r.date; });
  const earliestKey = earliest.slice(0,7);
  let count=1;
  for(let i=1;i<=MAX_MONTHS_BACK;i++){
    if(monthKeyOffset(i) < earliestKey) break;
    count++;
  }
  return count;
}

/* ---- monthly report: slideable pie of expense/income by category ---- */
const PIE_COLORS = ["#3B4F9E","#1FA971","#9B2D52","#D9663F","#5A6270","#8A55C7",
                    "#2DD4BF","#C79A3E","#3B82F6","#B23A6E","#4B9E8A","#6B7DE8"];
/* stable color for a category id (used for budget + category icon chips) */
function catColor(id){
  let h=0; const s=String(id);
  for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  return PIE_COLORS[h % PIE_COLORS.length];
}

/* build an SVG donut from slices [{value,color,emoji}]; labels big-enough slices */
function pieSVG(items, total){
  if(!total) return "";
  const cx=90, cy=90, r=74, rin=42;
  const rmid=(r+rin)/2;
  let a0=-Math.PI/2; // start at top
  const parts = items.map((it)=>{
    const frac = it.value/total;
    const a1 = a0 + frac*Math.PI*2;
    const large = (a1-a0) > Math.PI ? 1 : 0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0);
    const x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const xi1=cx+rin*Math.cos(a1), yi1=cy+rin*Math.sin(a1);
    const xi0=cx+rin*Math.cos(a0), yi0=cy+rin*Math.sin(a0);
    const amid=(a0+a1)/2;
    const lx=cx+rmid*Math.cos(amid), ly=cy+rmid*Math.sin(amid);
    const pct=Math.round(frac*100);
    a0=a1;

    let shape;
    if(frac >= 0.9999){
      shape = `<circle cx="${cx}" cy="${cy}" r="${rmid}" fill="none" stroke="${it.color}" stroke-width="${r-rin}"></circle>`;
    } else {
      shape = `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${xi1} ${yi1} A ${rin} ${rin} 0 ${large} 0 ${xi0} ${yi0} Z" fill="${it.color}"></path>`;
    }
    /* only label slices large enough to hold text (~8%+) */
    let label = "";
    if(frac >= 0.08){
      label = `<text class="pie-emoji" x="${lx}" y="${ly-2}" text-anchor="middle" dominant-baseline="middle">${esc(it.emoji||"")}</text>`+
              `<text class="pie-lbl" x="${lx}" y="${ly+11}" text-anchor="middle" dominant-baseline="middle" font-size="9">${pct}%</text>`;
    }
    return { shape, label };
  });
  /* shapes first, then all labels on top so no slice overlaps a neighbour's text */
  return `<svg viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">`+
    parts.map(p=>p.shape).join("") + parts.map(p=>p.label).join("") + `</svg>`;
}

/* keep overview, budgets, and report sliders all on the same month index */
const SLIDER_IDS = [
  { s:"sumslider",    d:"sumdots" },
  { s:"budgetslider", d:"budgetdots" },
  { s:"reportslider", d:"reportdots" }
];
function syncSliders(source, sourceDots){
  if(sliderSyncing) return;
  const idx = Math.round(source.scrollLeft / (source.clientWidth||1));
  sliderSyncing = true;
  SLIDER_IDS.forEach(({s,d})=>{
    const sl = $(s), dt = $(d);
    if(!sl || !dt) return;
    if(sl !== source){
      const cur = Math.round(sl.scrollLeft / (sl.clientWidth||1));
      if(cur !== idx && sl.children.length > idx){
        sl.scrollTo({ left: idx*sl.clientWidth, behavior:"auto" });
      }
    }
    [...dt.children].forEach((sp,i)=>sp.classList.toggle("on", i===idx));
  });
  requestAnimationFrame(()=>{ sliderSyncing=false; });
}

/* tap a budget → see that category's transactions for the given month */
function openBudgetHistory(b, monthKey){
  const key = monthKey || iso(new Date()).slice(0,7);
  const rows = TX.all.filter(r=>r.categoryId===b.categoryId && r.date.indexOf(key)===0)
    .sort((a,c)=>{ if(c.date!==a.date) return c.date.localeCompare(a.date); return (c.loggedAt||0)-(a.loggedAt||0); });
  const income = b.kind==="income";
  const total = rows.reduce((a,r)=>a+r.amount,0);
  const monthLabel = new Date(key+"-01T00:00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"});
  const listHtml = rows.length ? rows.map(r=>`
      <div class="mrow" data-log="${esc(String(r.loggedAt))}" style="cursor:pointer">
        <span class="dot" style="background:${esc(memberColor(r.memberId))}">${esc((memberName(r.memberId)[0]||"?").toUpperCase())}</span>
        <span class="t"><b>${income?"+":"−"}${fmt(r.amount)}</b>
          <small>${esc(r.date)} · ${esc(walletLabel(r.walletId))}${r.note?" · "+esc(r.note):""}</small></span>
      </div>`).join("")
    : `<div class='sd'>No transactions in this category in ${esc(monthLabel)}.</div>`;
  openSheet(`
    <h2>${esc(b.emoji||"✨")} ${esc(b.name)}</h2>
    <div class="sd">${esc(monthLabel)} · ${fmt(total)} ${income?"received":"spent"}${b.budget?(" of "+fmt(b.budget)+(income?" target":" budget")):""}</div>
    <div class="manage-list">${listHtml}</div>
    <button class="ghost" id="bh-close" type="button">Close</button>
  `);
  $("bh-close").onclick = closeSheet;
  /* tapping a row opens that transaction's detail/edit */
  $("sheet-body").querySelectorAll("[data-log]").forEach(row=>{
    row.onclick = ()=>{
      const lg = Number(row.dataset.log);
      const entry = TX.all.find(x=>x.loggedAt===lg);
      if(entry) openTxDetail(entry);
    };
  });
}

function renderTxList(rows){

    return (b.loggedAt||0)-(a.loggedAt||0);

  const slice = sorted.slice(0, TX.shown);
  let curM="", curD="";
  slice.forEach(r=>{
    const d=new Date(r.date+"T00:00:00");
    const valid=!isNaN(d.getTime());
    const mk=r.date.slice(0,7);
    if(mk!==curM){
      curM=mk; curD="";
      const h=document.createElement("div"); h.className="rmonth";
      h.textContent = valid ? d.toLocaleDateString("id-ID",{month:"long", year:"numeric"}) : mk;
      list.appendChild(h);
    }
    if(r.date!==curD){
      curD=r.date;
      const h=document.createElement("div"); h.className="rday";
      h.textContent = valid ? d.toLocaleDateString("id-ID",{weekday:"long", day:"numeric", month:"short"}) : r.date;
      list.appendChild(h);
    }
    const isIn=r.type==="Income";
    const wrap=document.createElement("div"); wrap.className="rwrap";
    wrap.innerHTML =
      `<button class="rtrash" type="button" aria-label="Delete">🗑️</button>`+
      `<div class="rcard ${isIn?"inc":"exp"}">`+
        `<div class="cico">${esc(catEmoji(r.categoryId))}`+
          `<span class="badge" style="background:${esc(memberColor(r.memberId))}">${esc((memberName(r.memberId)[0]||"?").toUpperCase())}</span></div>`+
        `<div class="mid"><div class="cat">${esc(catLabel(r.categoryId))}</div>`+
        `<div class="sub">${esc(walletLabel(r.walletId))}${r.note?` · ${esc(r.note)}`:""}</div></div>`+
        `<div class="amt">${isIn?"+":"−"}${fmt(r.amount)}</div>`+
      `</div>`;
    attachSwipeDelete(wrap, r);
    list.appendChild(wrap);
  });
  $("lm-wrap").style.display = sorted.length > TX.shown ? "flex" : "none";
}
$("loadmore").onclick = ()=>{ TX.shown += PAGE; renderTxList(homeRows()); };

const TRASH_W = 76;
function attachSwipeDelete(wrap, entry){
  const card=wrap.querySelector(".rcard"), trash=wrap.querySelector(".rtrash");
  let sx=0, cx=0, drag=false, moved=false;
  card.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; drag=true; moved=false; card.style.transition="none"; },{passive:true});
  card.addEventListener("touchmove", e=>{
    if(!drag) return;
    cx=e.touches[0].clientX-sx;
    if(Math.abs(cx)>6) moved=true;
    if(cx>0) cx=0;
    if(cx<-TRASH_W) cx=-TRASH_W-(cx+TRASH_W)*0.25;
    card.style.transform=`translateX(${cx}px)`;
  },{passive:true});
  card.addEventListener("touchend", (e)=>{
    drag=false; card.style.transition="transform .18s ease-out";
    const open = cx < -TRASH_W/2;
    card.style.transform = open ? `translateX(-${TRASH_W}px)` : "translateX(0)";
    /* a genuine tap (no meaningful drag) opens the detail sheet */
    if(!moved && cx===0){
      e.preventDefault(); // suppress the synthetic click that would hit the fresh overlay
      openTxDetail(entry);
    }
    cx=0;
  }, {passive:false});
  /* desktop / non-touch: plain click opens detail */
  card.addEventListener("click", e=>{
    if("ontouchstart" in window) return; // touch handled above
    openTxDetail(entry);
  });
  trash.onclick = async ev=>{
    ev.stopPropagation();
    if(entry.loggedAt==null){ trash.textContent="⚠️"; return; }
    trash.disabled=true; trash.textContent="…";
    try{
      await api({action:"deleteTx", loggedAt:entry.loggedAt});
      TX.all = TX.all.filter(x=>x.loggedAt!==entry.loggedAt);
      renderTxPage();
    }catch(e){ trash.disabled=false; trash.textContent="⚠️"; }
  };
}

/* ---- transaction detail + edit ---- */
function openTxDetail(entry){
  const cat = catById(entry.categoryId), w = walletById(entry.walletId);
  const isIn = entry.type==="Income";
  openSheet(`
    <h2 style="color:${esc(memberColor(entry.memberId))}">${isIn?"Income":"Expense"}</h2>
    <div class="amt" style="color:${isIn?"var(--inc)":"var(--exp)"}">${isIn?"+":"−"}${fmt(entry.amount)}</div>
    <div class="row"><span>Category</span><b>${esc(catEmoji(entry.categoryId))} ${esc(catLabel(entry.categoryId))}</b></div>
    <div class="row"><span>${isIn?"Destination":"Wallet"}</span><b>${esc(walletLabel(entry.walletId))}</b></div>
    <div class="row"><span>Person</span><b>${esc(memberName(entry.memberId))}</b></div>
    <div class="row"><span>Date</span><b>${esc(entry.date)}</b></div>
    ${entry.note?`<div class="row"><span>Note</span><b>${esc(entry.note)}</b></div>`:""}
    <div class="seg" style="margin-top:16px">
      <button type="button" id="td-close">Close</button>
      <button type="button" id="td-edit" style="background:var(--person);border-color:var(--person);color:#fff">Edit</button>
    </div>
  `);
  $("td-close").onclick = closeSheet;
  $("td-edit").onclick = ()=>openTxEdit(entry);
}

function openTxEdit(entry){
  /* working copy of the entry being edited */
  const E = {
    loggedAt: entry.loggedAt, type: entry.type, memberId: entry.memberId,
    categoryId: entry.categoryId, amount: entry.amount, walletId: entry.walletId,
    date: entry.date, note: entry.note || ""
  };
  function catsFor(){ const k=E.type==="Income"?"income":"expense";
    return forMember(D.categories, E.memberId).filter(c=>c.kind===k); }
  function walletsFor(){
    let list=forMember(D.wallets, E.memberId);
    if(E.type==="Income") list=list.filter(w=>w.type!=="debt");
    const rank=w=>(w.type==="debt"?2:(w.ownerId===JOINT?1:0));
    return list.slice().sort((a,b)=>rank(a)-rank(b));
  }
  function render(){
    openSheet(`
      <h2>Edit transaction</h2>
      <div class="sd">Change any detail, then save.</div>
      <div class="type" style="margin-top:0;margin-bottom:14px">
        <button type="button" id="te-exp" class="${E.type==="Expense"?"sel":""}">Expense</button>
        <button type="button" id="te-inc" class="${E.type==="Income"?"sel":""}">Income</button>
      </div>
      <div class="fld"><label>Person</label>
        <select id="te-member">${D.members.map(m=>`<option value="${esc(m.id)}" ${m.id===E.memberId?"selected":""}>${esc(m.name)}</option>`).join("")}</select></div>
      <div class="fld"><label>Category</label>
        <select id="te-cat">${catsFor().map(c=>`<option value="${esc(c.id)}" ${c.id===E.categoryId?"selected":""}>${esc(c.emoji||"")} ${esc(c.name)}</option>`).join("")}</select></div>
      <div class="fld"><label>Amount</label>
        <input id="te-amt" class="num" inputmode="numeric" value="${E.amount?Number(E.amount).toLocaleString("id-ID"):""}"></div>
      <div class="fld"><label>${E.type==="Income"?"Destination":"Wallet"}</label>
        <select id="te-wal">${walletsFor().map(w=>`<option value="${esc(w.id)}" ${w.id===E.walletId?"selected":""}>${esc(walletLabel(w.id))}</option>`).join("")}</select></div>
      <div class="fld"><label>Date</label>
        <input id="te-date" type="date" value="${esc(E.date)}"></div>
      <div class="fld"><label>Note (optional)</label>
        <input id="te-note" type="text" maxlength="140" value="${esc(E.note)}" placeholder="Add a note"></div>
      <button class="go" id="te-save" type="button">Save changes</button>
      <button class="ghost" id="te-back" type="button">Cancel</button>
    `);
    { const mx=new Date(), mn=new Date(); mn.setDate(mn.getDate()-30);
      $("te-date").max=iso(mx); $("te-date").min=iso(mn); }
    $("te-amt").addEventListener("input", ev=>{
      const n=Number(String(ev.target.value).replace(/[^\d]/g,""));
      ev.target.value = n?n.toLocaleString("id-ID"):""; E.amount=n;
    });
    $("te-exp").onclick = ()=>{ if(E.type==="Expense")return; E.type="Expense";
      E.categoryId=(catsFor()[0]||{}).id||null; E.walletId=(walletsFor()[0]||{}).id||null; syncFromInputs(); render(); };
    $("te-inc").onclick = ()=>{ if(E.type==="Income")return; E.type="Income";
      E.categoryId=(catsFor()[0]||{}).id||null; E.walletId=(walletsFor()[0]||{}).id||null; syncFromInputs(); render(); };
    $("te-member").onchange = ()=>{ E.memberId=$("te-member").value;
      /* keep category/wallet valid for the new member */
      if(!catsFor().some(c=>c.id===E.categoryId)) E.categoryId=(catsFor()[0]||{}).id||null;
      if(!walletsFor().some(w=>w.id===E.walletId)) E.walletId=(walletsFor()[0]||{}).id||null;
      syncFromInputs(); render(); };
    $("te-cat").onchange = ()=>{ E.categoryId=$("te-cat").value; };
    $("te-wal").onchange = ()=>{ E.walletId=$("te-wal").value; };
    $("te-date").onchange = ()=>{ E.date=$("te-date").value; };
    $("te-note").addEventListener("input", ()=>{ E.note=$("te-note").value; });
    $("te-back").onclick = ()=>openTxDetail(entry);
    $("te-save").onclick = doSave;
  }
  function syncFromInputs(){
    /* preserve amount/note the user may have typed before re-rendering on a toggle */
    if($("te-amt")) E.amount = Number(String($("te-amt").value).replace(/[^\d]/g,""))||E.amount;
    if($("te-note")) E.note = $("te-note").value;
  }
  async function doSave(){
    syncFromInputs();
    E.categoryId = $("te-cat").value; E.walletId = $("te-wal").value;
    E.memberId = $("te-member").value; E.date = $("te-date").value;
    if(!(E.amount>0)){ alertSheet("Amount must be more than 0"); return; }
    if(!E.categoryId){ alertSheet("Pick a category"); return; }
    if(!E.walletId){ alertSheet("Pick a wallet"); return; }
    const b=$("te-save"); b.disabled=true; b.textContent="Saving…";
    try{
      await api({action:"updateTx", loggedAt:E.loggedAt, type:E.type, memberId:E.memberId,
                 categoryId:E.categoryId, amount:E.amount, walletId:E.walletId, date:E.date, note:(E.note||"").trim()});
      /* update local copy + refresh */
      const i = TX.all.findIndex(x=>x.loggedAt===E.loggedAt);
      if(i>=0) TX.all[i] = { loggedAt:E.loggedAt, date:E.date, memberId:E.memberId,
        categoryId:E.categoryId, amount:E.amount, walletId:E.walletId, type:E.type, note:(E.note||"").trim() };
      closeSheet(); renderHome(); renderTxPage();
    }catch(e){ b.disabled=false; b.textContent="Couldn't save — "+e.message; }
  }
  render();
}

/* ================= WALLET ================= */
$("add-wallet-btn").onclick = ()=>openWalletSheet(null);

async function loadWallets(){
  if(!D.wallets.length && !D.members.length) return;
  $("wallet-state").innerHTML="Loading…";
  try{
    const out = await api({action:"balances"});
    BAL.balances=out.balances||{}; BAL.debts=out.debts||{}; BAL.starting=out.starting||{};
    $("wallet-state").innerHTML="";
    renderWallets();
  }catch(e){
    $("wallet-state").innerHTML="Couldn't load — <button id='w-retry' type='button'>Retry</button>"+
      "<div class='raw'>"+esc(e.message)+"</div>";
    $("w-retry").onclick=loadWallets;
  }
}

const WALLET_THEMES = ["#22B378","#3B82F6","#A855C7","#CFA94D","#2DD4BF","#E5573D","#6B7DE8","#D08A3E"];
function walletTheme(w, i){ return WALLET_THEMES[i % WALLET_THEMES.length]; }

function renderWallets(){
  const el=$("wallet-list"); el.innerHTML="";
  const debts = D.wallets.filter(w=>w.type==="debt");
  const normals = D.wallets.filter(w=>w.type!=="debt");
  /* group: joint first, then each member */
  const groups = [{key:JOINT, label:"Joint / Household"}]
    .concat(D.members.map(m=>({key:m.id, label:m.name+"'s Wallets"})));

  let idx=0;
  groups.forEach(g=>{
    const mine = normals.filter(w=>w.ownerId===g.key);
    const orphanDebts = debts.filter(w=>w.ownerId===g.key && !normals.some(n=>n.id===w.linkedWalletId));
    if(!mine.length && !orphanDebts.length) return;
    const h=document.createElement("div"); h.className="wgroup"; h.textContent=g.label;
    el.appendChild(h);

    mine.forEach(w=>{
      const val = BAL.balances[w.id] || 0;
      const linked = debts.filter(dw=>dw.linkedWalletId===w.id);
      const color = walletTheme(w, idx++);
      const card=document.createElement("div");
      card.className="wcard"+(linked.length?" has-debt":"");
      card.style.borderLeftColor=color;
      card.innerHTML=`
        <div class="wchip" style="background:${color}22;color:${color}">${esc((w.name[0]||"?").toUpperCase())}</div>
        <div class="wmeta"><div class="wname">${esc(w.name)}</div>
          <div class="whint">${BAL.starting[w.id]?("start "+fmt(BAL.starting[w.id])):"no starting balance set"}</div></div>
        <div class="wval">${fmt(val)}</div>
        <button class="wedit" type="button" aria-label="Options">✎</button>`;
      card.querySelector(".wedit").onclick=()=>openBalanceSheet(w);
      el.appendChild(card);

      if(linked.length){
        const box=document.createElement("div"); box.className="debtbox";
        let total=0;
        linked.forEach(dw=>{ total += (BAL.debts[dw.id]||0); });
        box.innerHTML = linked.map(dw=>{
          const amt=BAL.debts[dw.id]||0;
          return `<div class="drow"><span>${esc(dw.name)} bill</span><b>−${fmt(amt)}</b></div>`;
        }).join("")
        + `<div class="drow approx"><span>Approx. Balance</span><b>${fmt(val-total)}</b></div>`
        + linked.map(dw=>{
            const amt=BAL.debts[dw.id]||0;
            return amt>0
              ? `<div class="swipepay" data-w="${esc(dw.id)}"><div class="fill"></div><span>Swipe to confirm ${esc(dw.name)} paid</span></div>`
              : `<div class="swipepay done"><span>${esc(dw.name)} all caught up ✓</span></div>`;
          }).join("");
        el.appendChild(box);
        box.querySelectorAll(".swipepay[data-w]").forEach(bar=>attachSwipePay(bar, bar.dataset.w));
      }
    });

    /* debt wallets not linked to any account yet */
    orphanDebts.forEach(dw=>{
      const amt=BAL.debts[dw.id]||0;
      const card=document.createElement("div");
      card.className="wcard"; card.style.borderLeftColor="var(--exp)";
      card.innerHTML=`
        <div class="wchip" style="background:#E5573D22;color:var(--exp)">${esc((dw.name[0]||"?").toUpperCase())}</div>
        <div class="wmeta"><div class="wname">${esc(dw.name)}</div>
          <div class="whint">credit / bill · not linked to a wallet yet</div></div>
        <div class="wval" style="color:var(--exp)">−${fmt(amt)}</div>
        <button class="wedit" type="button" aria-label="Edit">✎</button>`;
      card.querySelector(".wedit").onclick=()=>openWalletSheet(dw.id);
      el.appendChild(card);
    });
  });

  if(!el.children.length){
    el.innerHTML="<div class='sd' style='color:var(--muted);font-size:13px;padding:14px 4px'>No wallets yet — add your first one below.</div>";
  }
}

function openBalanceSheet(w){
  const cur = BAL.starting[w.id];
  openSheet(`
    <h2>${esc(w.name)}</h2>
    <div class="sd">${w.ownerId===JOINT?"Joint wallet":esc(memberName(w.ownerId))+"'s wallet"} · balance now ${fmt(BAL.balances[w.id]||0)}</div>
    <div class="fld"><label>Starting balance</label>
      <input id="bf-val" class="num" inputmode="numeric" placeholder="e.g. 1.500.000"
             value="${cur?Number(cur).toLocaleString("id-ID"):""}">
      <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px">What this wallet held when you started tracking.</div></div>
    <button class="go" id="bf-save" type="button">Save balance</button>
    <button class="ghost" id="bf-edit" type="button">Edit wallet details</button>
    <button class="ghost" id="bf-cancel" type="button">Cancel</button>
  `);
  $("bf-val").addEventListener("input", e=>{
    const n=Number(String(e.target.value).replace(/[^\d]/g,""));
    e.target.value = n ? n.toLocaleString("id-ID") : "";
  });
  $("bf-cancel").onclick = closeSheet;
  $("bf-edit").onclick = ()=>openWalletSheet(w.id);
  $("bf-save").onclick = async ()=>{
    const val=Number(String($("bf-val").value).replace(/[^\d]/g,""))||0;
    const b=$("bf-save"); b.disabled=true; b.textContent="Saving…";
    try{ await api({action:"setBalance", walletId:w.id, value:val}); closeSheet(); loadWallets(); }
    catch(e){ b.disabled=false; b.textContent="Couldn't save — "+e.message; }
  };
}

function attachSwipePay(bar, walletId){
  const fill=bar.querySelector(".fill");
  let sx=0, drag=false, w=0;
  bar.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; w=bar.clientWidth; drag=true; fill.style.transition="none"; },{passive:true});
  bar.addEventListener("touchmove", e=>{
    if(!drag) return;
    let dx=e.touches[0].clientX-sx;
    if(dx<0) dx=0; if(dx>w) dx=w;
    fill.style.width=dx+"px";
  },{passive:true});
  bar.addEventListener("touchend", ()=>{
    drag=false; fill.style.transition="width .18s ease-out";
    if(fill.offsetWidth/w > 0.85) confirmPaid(walletId, bar);
    else fill.style.width="0px";
  });
  bar.addEventListener("click", ()=>confirmPaid(walletId, bar));
}
async function confirmPaid(walletId, bar){
  bar.querySelector("span").textContent="Confirming…";
  try{ await api({action:"markPaid", walletId}); loadWallets(); }
  catch(e){ bar.querySelector("span").textContent="Couldn't confirm — tap to retry"; bar.querySelector(".fill").style.width="0px"; }
}

boot();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
